name: Set up production parity controller
description: Install the exact controller dependency constraints from the candidate

runs:
  using: composite
  steps:
    - name: Set up candidate Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install candidate-derived controller dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        python3 scripts/resolve_production_parity_controller_requirements.py \
          --requirements requirements.txt \
          --output "$RUNNER_TEMP/production-parity-controller-requirements.txt"
        python3 -m pip install \
          --disable-pip-version-check \
          --requirement "$RUNNER_TEMP/production-parity-controller-requirements.txt"
        python3 -m pip check

    - name: Prove clean-runner controller imports
      shell: bash
      run: |
        set -Eeuo pipefail
        scripts=(
          scripts/build_production_parity_contract.py
          scripts/capture_production_parity_runtime_config.py
          scripts/cleanup_production_parity_staging.py
          scripts/materialize_production_parity_secrets.py
          scripts/production_parity_snapshot.py
          scripts/provision_production_parity_staging.py
          scripts/run_production_parity_fast.py
          scripts/run_production_parity_full_host.py
          scripts/setup_production_parity_staging.py
        )
        for script in "${scripts[@]}"; do
          python3 "$script" --help >/dev/null
        done
