name: Gateway Attested Release

# Publication is intentionally suspended while release builders are isolated.
# Restore build/publish jobs only through a reviewed change after every exit
# condition in docs/attested-release-isolation.md has external proof.
on:
  workflow_dispatch:

concurrency:
  group: gateway-attested-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-isolation-admission:
    name: Release isolation prerequisites are not complete
    if: github.repository == 'leadpoet/leadpoet' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: attested-release
    timeout-minutes: 5
    steps:
      - name: Check out exact release source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact main source
        run: bash .github/scripts/require_attested_release_source.sh

      - name: Fail closed until independent release setup is proved
        run: |
          echo '::error::Attested publication is suspended. The dedicated isolated RunsOn builder, protected main-only environment, narrow OIDC trust/role and Nitro 1.4.2 reproduction must be verified before a reviewed workflow change can enable release.'
          echo 'See docs/attested-release-isolation.md for the exact exit conditions.'
          exit 1
