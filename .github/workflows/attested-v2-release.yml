name: Attested V2 Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: attested-v2-release-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_BUCKET: leadpoet-attested-v2-artifacts-493765492819
  RELEASE_PREFIX: attested-v2/releases
  ACCEPTANCE_SIGNER_PUBKEY_HASH: sha256:cdc20e17d9ecee5da04b30604ac72bc015326640ab98501646551f075d60ef36

jobs:
  gateway-parent:
    name: Independent gateway-parent builds
    runs-on: [self-hosted, linux, x64, leadpoet-gateway-v2-builder]
    timeout-minutes: 720
    env:
      LEADPOET_SENTRY_ENABLED: ${{ secrets.LEADPOET_SENTRY_DSN != '' }}
      LEADPOET_SENTRY_DSN: ${{ secrets.LEADPOET_SENTRY_DSN }}
      LEADPOET_SENTRY_ENVIRONMENT: release
      LEADPOET_SENTRY_RELEASE: ${{ github.sha }}
      LEADPOET_SENTRY_TRACES_SAMPLE_RATE: "0.01"
    steps:
      - name: Initialize bounded release timing
        id: telemetry_start
        continue-on-error: true
        run: date +%s > "$RUNNER_TEMP/leadpoet-release-started"

      - name: Reset stale V2 runner workspace before checkout
        id: stale_cleanup
        run: |
          set -Eeuo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          test -n "${GITHUB_REPOSITORY:-}"
          test -n "${RUNNER_TEMP:-}"
          test -d "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE"
          workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          runner_work_root="$(realpath -- "$(dirname -- "$RUNNER_TEMP")")"
          repository_name="${GITHUB_REPOSITORY#*/}"
          test -n "$repository_name"
          test "$(dirname -- "$(dirname -- "$workspace")")" = "$runner_work_root"
          test "$(basename -- "$workspace")" = "$repository_name"
          test "$(basename -- "$(dirname -- "$workspace")")" = "$repository_name"
          sudo find -P "$workspace" -xdev -depth -mindepth 1 -delete

      - name: Check out exact release source
        id: source_checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Guard gateway builder host memory
        id: host_memory_guard
        run: |
          python3 gateway/tee/host_memory_guard_v2.py \
            --cleanup-disposable-tests \
            --minimum-available-mib 16384

      - name: Reclaim unreferenced gateway build space
        id: storage_reclaim
        run: |
          sudo rm -rf -- \
            "$RUNNER_TEMP/offline-artifacts" \
            "$RUNNER_TEMP/gateway-evidence" \
            "$RUNNER_TEMP/gateway-build-work" \
            "$RUNNER_TEMP/gateway-pcr0-cache.json" \
            "$RUNNER_TEMP/validator-build-work" \
            "$RUNNER_TEMP/validator-evidence" \
            "$RUNNER_TEMP/release-evidence" \
            "$RUNNER_TEMP/evidence" \
            "$RUNNER_TEMP/release"
          VALIDATOR_DOCKER_ALLOW_DATA_ROOT_RESET=1 \
          VALIDATOR_DOCKER_ALLOW_LIVE_HOST_GATEWAY_PRUNE=1 \
          REQUIRE_ZERO_RUNTIME_RECONCILE=1 \
            bash validator_tee/scripts/reclaim_docker_storage_v2.sh
          df -h /

      - name: Prepare immutable build inputs
        id: source_prepare
        run: |
          export GATEWAY_V2_OFFLINE_ARTIFACT_ROOT="$RUNNER_TEMP/offline-artifacts"
          nice -n 10 ionice -c2 -n7 bash gateway/tee/prepare_offline_artifacts_v2.sh

      - name: Build gateway and validator evidence
        id: gateway_validator_build
        run: |
          . validator_tee/scripts/docker_operation_lock_v2.sh
          leadpoet_acquire_docker_operation_lock_v2
          python3 -m validator_tee.host.docker_operation_guard_v2 \
            --wait \
            --timeout-seconds 1800 \
            --interval-seconds 3
          release_image_inventory="$RUNNER_TEMP/gateway-parent-preexisting-images.txt"
          bash validator_tee/scripts/reclaim_release_build_images_v2.sh \
            snapshot "$release_image_inventory"
          cleanup_release_build_images() {
            bash validator_tee/scripts/reclaim_release_build_images_v2.sh \
              cleanup "$release_image_inventory"
            docker builder prune --all --force
          }
          cleanup_release_build_images_on_exit() {
            local build_status="$?"
            local cleanup_status=0
            trap - EXIT
            cleanup_release_build_images || cleanup_status="$?"
            if [ "$build_status" -ne 0 ]; then
              exit "$build_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_release_build_images_on_exit EXIT
          python3 gateway/tee/host_memory_guard_v2.py \
            --cleanup-disposable-tests \
            --minimum-available-mib 4096

          export GATEWAY_V2_OFFLINE_ARTIFACT_ROOT="$RUNNER_TEMP/offline-artifacts"
          export GATEWAY_V2_BUILDER_DOMAIN=gateway
          export GATEWAY_V2_BUILDER_ID="gateway-parent-${RUNNER_NAME}"
          export GATEWAY_V2_BUILD_REVISION="$GITHUB_SHA"
          export GATEWAY_V2_BUILD_EVIDENCE_DIR="$RUNNER_TEMP/gateway-evidence"
          export GATEWAY_V2_BUILD_WORK_ROOT="$RUNNER_TEMP/gateway-build-work"
          export GATEWAY_V2_PCR0_CACHE_FILE="$RUNNER_TEMP/gateway-pcr0-cache.json"
          nice -n 10 ionice -c2 -n7 bash gateway/tee/build_release_evidence_v2.sh

          rm -rf "$RUNNER_TEMP/gateway-build-work"
          cleanup_release_build_images
          df -h /

          export VALIDATOR_V2_BUILDER_DOMAIN=gateway
          export VALIDATOR_V2_BUILDER_ID="gateway-parent-${RUNNER_NAME}"
          export VALIDATOR_V2_BUILD_WORK_ROOT="$RUNNER_TEMP/validator-build-work"
          export VALIDATOR_V2_BUILD_EVIDENCE_DIR="$RUNNER_TEMP/validator-evidence"
          export VALIDATOR_V2_OFFLINE_ARTIFACT_ROOT="$RUNNER_TEMP/offline-artifacts/validator-runtime"
          nice -n 10 ionice -c2 -n7 bash validator_tee/scripts/build_release_evidence_v2.sh

          mkdir -p "$RUNNER_TEMP/release-evidence"
          cp "$RUNNER_TEMP/gateway-evidence/gateway-gateway-evidence.json" \
            "$RUNNER_TEMP/release-evidence/"
          cp "$RUNNER_TEMP/validator-evidence"/validator-gateway-*.json \
            "$RUNNER_TEMP/release-evidence/"

      - name: Upload gateway-parent evidence
        id: evidence_upload
        uses: actions/upload-artifact@v4
        with:
          name: v2-evidence-gateway-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/release-evidence/*.json

      - name: Reclaim gateway-parent storage after evidence generation
        id: final_cleanup
        if: always()
        run: |
          sudo rm -rf -- \
            "$RUNNER_TEMP/offline-artifacts" \
            "$RUNNER_TEMP/gateway-evidence" \
            "$RUNNER_TEMP/gateway-build-work" \
            "$RUNNER_TEMP/gateway-pcr0-cache.json" \
            "$RUNNER_TEMP/validator-build-work" \
            "$RUNNER_TEMP/validator-evidence" \
            "$RUNNER_TEMP/release-evidence" \
            "$RUNNER_TEMP/evidence" \
            "$RUNNER_TEMP/release"
          VALIDATOR_DOCKER_ALLOW_DATA_ROOT_RESET=1 \
          VALIDATOR_DOCKER_ALLOW_LIVE_HOST_GATEWAY_PRUNE=1 \
            bash validator_tee/scripts/reclaim_docker_storage_v2.sh
          df -h /

      - name: Emit bounded gateway-parent release summary
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          JOB_STATUS: ${{ job.status }}
          STALE_CLEANUP: ${{ steps.stale_cleanup.outcome }}
          SOURCE_CHECKOUT: ${{ steps.source_checkout.outcome }}
          HOST_MEMORY_GUARD: ${{ steps.host_memory_guard.outcome }}
          STORAGE_RECLAIM: ${{ steps.storage_reclaim.outcome }}
          SOURCE_PREPARE: ${{ steps.source_prepare.outcome }}
          GATEWAY_VALIDATOR_BUILD: ${{ steps.gateway_validator_build.outcome }}
          EVIDENCE_UPLOAD: ${{ steps.evidence_upload.outcome }}
          FINAL_CLEANUP: ${{ steps.final_cleanup.outcome }}
          LEADPOET_GITHUB_JOB_TOKEN: ${{ github.token }}
          LEADPOET_GITHUB_JOB_NAME: Independent gateway-parent builds
        run: |
          test -f leadpoet_observability/sentry_cli.py || exit 0
          status=failed
          test "$JOB_STATUS" = success && status=passed
          duration_args=()
          if read -r started < "$RUNNER_TEMP/leadpoet-release-started"; then
            duration_args=(--duration-seconds "$(( $(date +%s) - started ))")
          fi
          timing_args=(--github-job-name "$LEADPOET_GITHUB_JOB_NAME")
          python3 -m leadpoet_observability.sentry_cli release-summary \
            --component release-gateway-parent \
            --physical-role gateway-parent-builder \
            --status "$status" \
            --candidate-sha "$GITHUB_SHA" \
            --stage-status "stale_cleanup=${STALE_CLEANUP:-unexercised}" \
            --stage-status "source_checkout=${SOURCE_CHECKOUT:-unexercised}" \
            --stage-status "host_memory_guard=${HOST_MEMORY_GUARD:-unexercised}" \
            --stage-status "storage_reclaim=${STORAGE_RECLAIM:-unexercised}" \
            --stage-status "source_prepare=${SOURCE_PREPARE:-unexercised}" \
            --stage-status "gateway_validator_build=${GATEWAY_VALIDATOR_BUILD:-unexercised}" \
            --stage-status "evidence_upload=${EVIDENCE_UPLOAD:-unexercised}" \
            --stage-status "final_cleanup=${FINAL_CLEANUP:-unexercised}" \
            "${timing_args[@]}" \
            "${duration_args[@]}"

  validator-parent:
    name: Independent validator-parent builds
    runs-on: [self-hosted, linux, x64, leadpoet-validator-v2-builder]
    timeout-minutes: 720
    env:
      LEADPOET_SENTRY_ENABLED: ${{ secrets.LEADPOET_SENTRY_DSN != '' }}
      LEADPOET_SENTRY_DSN: ${{ secrets.LEADPOET_SENTRY_DSN }}
      LEADPOET_SENTRY_ENVIRONMENT: release
      LEADPOET_SENTRY_RELEASE: ${{ github.sha }}
      LEADPOET_SENTRY_TRACES_SAMPLE_RATE: "0.01"
    steps:
      - name: Initialize bounded release timing
        id: telemetry_start
        continue-on-error: true
        run: date +%s > "$RUNNER_TEMP/leadpoet-release-started"

      - name: Reset stale V2 runner workspace before checkout
        id: stale_cleanup
        run: |
          set -Eeuo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          test -n "${GITHUB_REPOSITORY:-}"
          test -n "${RUNNER_TEMP:-}"
          test -d "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE"
          workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          runner_work_root="$(realpath -- "$(dirname -- "$RUNNER_TEMP")")"
          repository_name="${GITHUB_REPOSITORY#*/}"
          test -n "$repository_name"
          test "$(dirname -- "$(dirname -- "$workspace")")" = "$runner_work_root"
          test "$(basename -- "$workspace")" = "$repository_name"
          test "$(basename -- "$(dirname -- "$workspace")")" = "$repository_name"
          sudo find -P "$workspace" -xdev -depth -mindepth 1 -delete

      - name: Check out exact release source
        id: source_checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Reclaim unreferenced validator build space
        id: storage_reclaim
        run: |
          sudo rm -rf -- \
            "$RUNNER_TEMP/offline-artifacts" \
            "$RUNNER_TEMP/gateway-evidence" \
            "$RUNNER_TEMP/gateway-build-work" \
            "$RUNNER_TEMP/gateway-pcr0-cache.json" \
            "$RUNNER_TEMP/validator-build-work" \
            "$RUNNER_TEMP/validator-evidence" \
            "$RUNNER_TEMP/release-evidence" \
            "$RUNNER_TEMP/evidence" \
            "$RUNNER_TEMP/release"
          VALIDATOR_DOCKER_ALLOW_DATA_ROOT_RESET=1 \
            bash validator_tee/scripts/reclaim_docker_storage_v2.sh
          df -h /

      - name: Prepare immutable build inputs
        id: source_prepare
        run: |
          export GATEWAY_V2_OFFLINE_ARTIFACT_ROOT="$RUNNER_TEMP/offline-artifacts"
          nice -n 10 ionice -c2 -n7 bash gateway/tee/prepare_offline_artifacts_v2.sh

      - name: Build gateway and validator evidence
        id: gateway_validator_build
        run: |
          . validator_tee/scripts/docker_operation_lock_v2.sh
          leadpoet_acquire_docker_operation_lock_v2
          python3 -m validator_tee.host.docker_operation_guard_v2 \
            --wait \
            --timeout-seconds 1800 \
            --interval-seconds 3
          release_image_inventory="$RUNNER_TEMP/validator-parent-preexisting-images.txt"
          bash validator_tee/scripts/reclaim_release_build_images_v2.sh \
            snapshot "$release_image_inventory"
          cleanup_release_build_images() {
            bash validator_tee/scripts/reclaim_release_build_images_v2.sh \
              cleanup "$release_image_inventory"
            docker builder prune --all --force
          }
          cleanup_release_build_images_on_exit() {
            local build_status="$?"
            local cleanup_status=0
            trap - EXIT
            cleanup_release_build_images || cleanup_status="$?"
            if [ "$build_status" -ne 0 ]; then
              exit "$build_status"
            fi
            exit "$cleanup_status"
          }
          trap cleanup_release_build_images_on_exit EXIT

          export GATEWAY_V2_OFFLINE_ARTIFACT_ROOT="$RUNNER_TEMP/offline-artifacts"
          export GATEWAY_V2_BUILDER_DOMAIN=validator
          export GATEWAY_V2_BUILDER_ID="validator-parent-${RUNNER_NAME}"
          export GATEWAY_V2_BUILD_REVISION="$GITHUB_SHA"
          export GATEWAY_V2_BUILD_EVIDENCE_DIR="$RUNNER_TEMP/gateway-evidence"
          export GATEWAY_V2_BUILD_WORK_ROOT="$RUNNER_TEMP/gateway-build-work"
          export GATEWAY_V2_PCR0_CACHE_FILE="$RUNNER_TEMP/gateway-pcr0-cache.json"
          nice -n 10 ionice -c2 -n7 bash gateway/tee/build_release_evidence_v2.sh

          rm -rf "$RUNNER_TEMP/gateway-build-work"
          cleanup_release_build_images
          df -h /

          export VALIDATOR_V2_BUILDER_DOMAIN=validator
          export VALIDATOR_V2_BUILDER_ID="validator-parent-${RUNNER_NAME}"
          export VALIDATOR_V2_BUILD_WORK_ROOT="$RUNNER_TEMP/validator-build-work"
          export VALIDATOR_V2_BUILD_EVIDENCE_DIR="$RUNNER_TEMP/validator-evidence"
          export VALIDATOR_V2_OFFLINE_ARTIFACT_ROOT="$RUNNER_TEMP/offline-artifacts/validator-runtime"
          nice -n 10 ionice -c2 -n7 bash validator_tee/scripts/build_release_evidence_v2.sh

          mkdir -p "$RUNNER_TEMP/release-evidence"
          cp "$RUNNER_TEMP/gateway-evidence/gateway-validator-evidence.json" \
            "$RUNNER_TEMP/release-evidence/"
          cp "$RUNNER_TEMP/validator-evidence"/validator-validator-*.json \
            "$RUNNER_TEMP/release-evidence/"

      - name: Upload validator-parent evidence
        id: evidence_upload
        uses: actions/upload-artifact@v4
        with:
          name: v2-evidence-validator-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: ${{ runner.temp }}/release-evidence/*.json

      - name: Reclaim validator-parent storage after evidence generation
        id: final_cleanup
        if: always()
        run: |
          sudo rm -rf -- \
            "$RUNNER_TEMP/offline-artifacts" \
            "$RUNNER_TEMP/gateway-evidence" \
            "$RUNNER_TEMP/gateway-build-work" \
            "$RUNNER_TEMP/gateway-pcr0-cache.json" \
            "$RUNNER_TEMP/validator-build-work" \
            "$RUNNER_TEMP/validator-evidence" \
            "$RUNNER_TEMP/release-evidence" \
            "$RUNNER_TEMP/evidence" \
            "$RUNNER_TEMP/release"
          VALIDATOR_DOCKER_ALLOW_DATA_ROOT_RESET=1 \
            bash validator_tee/scripts/reclaim_docker_storage_v2.sh
          df -h /

