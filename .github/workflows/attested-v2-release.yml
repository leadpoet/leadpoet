            --component release-validator-parent \
            --physical-role validator-parent-builder \
            --status "$status" \
            --candidate-sha "$GITHUB_SHA" \
            --stage-status "stale_cleanup=${STALE_CLEANUP:-unexercised}" \
            --stage-status "source_checkout=${SOURCE_CHECKOUT:-unexercised}" \
            --stage-status "storage_reclaim=${STORAGE_RECLAIM:-unexercised}" \
            --stage-status "source_prepare=${SOURCE_PREPARE:-unexercised}" \
            --stage-status "gateway_validator_build=${GATEWAY_VALIDATOR_BUILD:-unexercised}" \
            --stage-status "evidence_upload=${EVIDENCE_UPLOAD:-unexercised}" \
            --stage-status "final_cleanup=${FINAL_CLEANUP:-unexercised}" \
            "${timing_args[@]}" \
            "${duration_args[@]}"

  publish:
    name: Assemble and immutably publish exact-commit channel
    needs: [gateway-parent, validator-parent]
    runs-on: [self-hosted, linux, x64, leadpoet-gateway-v2-builder]
    timeout-minutes: 30
    env:
      LEADPOET_SENTRY_ENABLED: ${{ secrets.LEADPOET_SENTRY_DSN != '' }}
      LEADPOET_SENTRY_DSN: ${{ secrets.LEADPOET_SENTRY_DSN }}
      LEADPOET_SENTRY_ENVIRONMENT: release
      LEADPOET_SENTRY_RELEASE: ${{ github.sha }}
      LEADPOET_SENTRY_TRACES_SAMPLE_RATE: "0.01"
    steps:
      - name: Initialize bounded release timing
        id: telemetry_start
        continue-on-error: true
        run: date +%s > "$RUNNER_TEMP/leadpoet-release-started"

      - name: Reset stale V2 runner workspace before checkout
        id: stale_cleanup
        run: |
          set -Eeuo pipefail
          test -n "${GITHUB_WORKSPACE:-}"
          test -n "${GITHUB_REPOSITORY:-}"
          test -n "${RUNNER_TEMP:-}"
          test -d "$GITHUB_WORKSPACE"
          test ! -L "$GITHUB_WORKSPACE"
          workspace="$(realpath -- "$GITHUB_WORKSPACE")"
          runner_work_root="$(realpath -- "$(dirname -- "$RUNNER_TEMP")")"
          repository_name="${GITHUB_REPOSITORY#*/}"
          test -n "$repository_name"
          test "$(dirname -- "$(dirname -- "$workspace")")" = "$runner_work_root"
          test "$(basename -- "$workspace")" = "$repository_name"
          test "$(basename -- "$(dirname -- "$workspace")")" = "$repository_name"
          sudo find -P "$workspace" -xdev -depth -mindepth 1 -delete

      - name: Check out exact release source
        id: source_checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download independent release evidence
        id: evidence_download
        uses: actions/download-artifact@v4
        with:
          pattern: v2-evidence-*-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          merge-multiple: true

      - name: Assemble both six-build manifests
        id: manifest_assembly
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          GATEWAY_V2_ACCEPTANCE_SIGNER_PUBKEY_HASH="$ACCEPTANCE_SIGNER_PUBKEY_HASH" \
            bash gateway/tee/assemble_release_manifest_v2.sh \
              "$RUNNER_TEMP/evidence/gateway-gateway-evidence.json" \
              "$RUNNER_TEMP/evidence/gateway-validator-evidence.json" \
              "$RUNNER_TEMP/release/gateway-v2-release-manifest.json"

          python3 -m validator_tee.host.verify_release_gate_v2 \
            --build-manifest \
            --evidence "$RUNNER_TEMP/evidence/validator-gateway-1.json" \
            --evidence "$RUNNER_TEMP/evidence/validator-gateway-2.json" \
            --evidence "$RUNNER_TEMP/evidence/validator-gateway-3.json" \
            --evidence "$RUNNER_TEMP/evidence/validator-validator-1.json" \
            --evidence "$RUNNER_TEMP/evidence/validator-validator-2.json" \
            --evidence "$RUNNER_TEMP/evidence/validator-validator-3.json" \
            --output "$RUNNER_TEMP/release/validator-v2-release-manifest.json"

          python3 -m gateway.tee.release_channel_v2 \
            --build \
            --gateway-manifest "$RUNNER_TEMP/release/gateway-v2-release-manifest.json" \
            --validator-manifest "$RUNNER_TEMP/release/validator-v2-release-manifest.json" \
            --output "$RUNNER_TEMP/release/release-channel-v2.json"

      - name: Publish with COMPLIANCE Object Lock
        id: immutable_publication
        run: |
          python3 -m gateway.tee.release_channel_v2 \
            --publish "$RUNNER_TEMP/release/release-channel-v2.json" \
            --bucket "$RELEASE_BUCKET" \
            --prefix "$RELEASE_PREFIX" \
            --retention-days 365

      - name: Emit bounded release publication summary
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          JOB_STATUS: ${{ job.status }}
          SOURCE_CHECKOUT: ${{ steps.source_checkout.outcome }}
          EVIDENCE_DOWNLOAD: ${{ steps.evidence_download.outcome }}
          MANIFEST_ASSEMBLY: ${{ steps.manifest_assembly.outcome }}
          IMMUTABLE_PUBLICATION: ${{ steps.immutable_publication.outcome }}
          LEADPOET_GITHUB_JOB_TOKEN: ${{ github.token }}
          LEADPOET_GITHUB_JOB_NAME: Assemble and immutably publish exact-commit channel
        run: |
          test -f leadpoet_observability/sentry_cli.py || exit 0
          status=failed
          test "$JOB_STATUS" = success && status=passed
          duration_args=()
          if read -r started < "$RUNNER_TEMP/leadpoet-release-started"; then
            duration_args=(--duration-seconds "$(( $(date +%s) - started ))")
          fi
          timing_args=(--github-job-name "$LEADPOET_GITHUB_JOB_NAME")
          python3 -m leadpoet_observability.sentry_cli release-summary \
            --component release-publisher \
            --physical-role release-publisher \
            --status "$status" \
            --candidate-sha "$GITHUB_SHA" \
            --stage-status "source_checkout=${SOURCE_CHECKOUT:-unexercised}" \
            --stage-status "evidence_download=${EVIDENCE_DOWNLOAD:-unexercised}" \
            --stage-status "manifest_assembly=${MANIFEST_ASSEMBLY:-unexercised}" \
            --stage-status "immutable_publication=${IMMUTABLE_PUBLICATION:-unexercised}" \
            "${timing_args[@]}" \
            "${duration_args[@]}"
