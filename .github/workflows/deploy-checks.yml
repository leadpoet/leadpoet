name: Deploy Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  deployment:
  workflow_dispatch:

concurrency:
  group: deploy-checks-${{ github.event.deployment.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  # One immutable source identity is shared by checkout verification and the
  # adapter-v10 tests. Do not replace this with a branch or a short ref.
  SOURCING_MODEL_SOURCE_SHA: "dda2a974dfa2c5c743da6c2da8e46355293ed325"
  DISABLE_BACKGROUND_TASKS: "true"
  ENABLE_FULFILLMENT: "false"
  LANGFUSE_ENABLED: "false"
  SUPABASE_URL: "http://localhost:54321"
  SUPABASE_ANON_KEY: "ci-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "ci-service-role-key"
  AWS_ACCESS_KEY_ID: "ci-access-key"
  AWS_SECRET_ACCESS_KEY: "ci-secret-key"
  AWS_S3_BUCKET: "leadpoet-ci"
  AWS_S3_REGION: "us-east-2"
  OPENROUTER_API_KEY: "ci-openrouter-key"
  OPENROUTER_KEY: "ci-openrouter-key"
  SCRAPINGDOG_API_KEY: "ci-scrapingdog-key"
  ZEROBOUNCE_API_KEY: "ci-zerobounce-key"
  BITTENSOR_NETWORK: "test"
  BITTENSOR_NETUID: "71"
  GATEWAY_PRIVATE_KEY_PASSWORD: "ci-gateway-key-password"

jobs:
  test:
    name: Unit and Workflow Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        # Every production runtime (gateway host, validator host, containers)
        # now runs Python 3.11; the sealed validator enclave stays on its
        # measured 3.7 image and is guarded by the AST annotation test.
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref || github.ref }}
          fetch-depth: 0

      - name: Check out exact Sourcing_model source
        uses: actions/checkout@v4
        with:
          repository: leadpoet/Sourcing_model
          ref: ${{ env.SOURCING_MODEL_SOURCE_SHA }}
          path: .ci/sourcing-model
          fetch-depth: 1
          token: ${{ secrets.SOURCING_MODEL_READ_TOKEN }}
          persist-credentials: false

      - name: Verify exact Sourcing_model source
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/.ci/sourcing-model"
          expected_sha="$SOURCING_MODEL_SOURCE_SHA"
          test -d "$source_root/.git"
          test "$(git -C "$source_root" rev-parse HEAD)" = "$expected_sha"
          test -z "$(git -C "$source_root" symbolic-ref -q HEAD || true)"
          test -z "$(git -C "$source_root" status --porcelain=v1 --untracked-files=all)"
          test "$(git -C "$source_root" ls-files -m -o --exclude-standard)" = ""
          test -f "$source_root/sourcing_model/consumer_contract.json"
          test -f "$source_root/sourcing_model/consumer_parity_fixtures.json"
          test "$(sha256sum "$source_root/sourcing_model/consumer_contract.json" | cut -d' ' -f1)" = "960c3ce752f1b978ebe0eb67be5db432fc4698b2a328d1f40ef6b0c52d38f7ab"
          test "$(sha256sum "$source_root/sourcing_model/consumer_parity_fixtures.json" | cut -d' ' -f1)" = "deef2e842dc70dd5e1e10f19693237e5714527a17b814c05e4f5bb47fd16e003"
          {
            echo "SOURCING_MODEL_SOURCE_ROOT=$source_root"
            echo "SOURCING_MODEL_SOURCE_SHA=$expected_sha"
          } >> "$GITHUB_ENV"

      - name: Verify repository instruction parity
        run: cmp --silent AGENTS.md CLAUDE.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Compile Python packages
        run: |
          python -m compileall -q \
            Leadpoet \
            gateway \
            leadpoet_audit \
            leadpoet_canonical \
            leadpoet_verifier \
            miner_models \
            qualification \
            research_lab \
            validator_models

      - name: Exercise pinned runsc rootfs-visible inputs
        run: |
          python_bin="$(command -v python)"
          sudo env PYTHONPATH="$GITHUB_WORKSPACE" \
            "$python_bin" \
            scripts/_runsc_rootfs_visible_inputs_probe_ci.py

      - name: Exercise validator enclave finalization under Python 3.7
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --cpus 1 \
            --memory 512m \
            --pids-limit 128 \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --env PYTHONPATH=/source \
            --workdir /source \
            python@sha256:b53f496ca43e5af6994f8e316cf03af31050bf7944e0e4a308ad86c001cf028b \
            python tests/validator_enclave_python37_runtime_probe.py

      - name: Exercise auditor canonical verification under Python 3.12
        run: |
          docker run --rm \
            --platform linux/amd64 \
            --network none \
            --cpus 1 \
            --memory 512m \
            --pids-limit 128 \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$PWD,dst=/source,readonly" \
            --env PYTHONPATH=/source \
            --workdir /source \
            python@sha256:57cd7c3a7a273101a6485ba99423ee568157882804b1124b4dd04266317710de \
            python tests/validator_enclave_python37_runtime_probe.py

      - name: Ensure PostgreSQL server binaries (migration integration test)
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 \
             && ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          pgbin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -r | head -1)"
          [ -n "$pgbin" ] && echo "$pgbin" >> "$GITHUB_PATH" || true
          "${pgbin:+$pgbin/}initdb" --version || true
          # Driver for the concurrent claim no-double-assign integration test.
          python -m pip install psycopg2-binary

      - name: Run pytest suite
        run: |
          python -m pytest -q \
            --cov=Leadpoet \
            --cov=gateway \
            --cov=leadpoet_canonical \
            --cov=leadpoet_verifier \
            --cov=qualification \
            --cov=research_lab \
            --cov=validator_models \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker Build Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: leadpoet-gateway:${{ github.sha }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}

      - name: Build validator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validator_models/containerizing/Dockerfile
          push: false
          tags: leadpoet-validator:${{ github.sha }}
