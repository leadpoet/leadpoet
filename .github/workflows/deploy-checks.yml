name: Deploy Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  deployment:
  workflow_dispatch:

concurrency:
  group: deploy-checks-${{ github.event.deployment.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  DISABLE_BACKGROUND_TASKS: "true"
  LANGFUSE_ENABLED: "false"
  SUPABASE_URL: "http://localhost:54321"
  SUPABASE_ANON_KEY: "ci-anon-key"
  SUPABASE_SERVICE_ROLE_KEY: "ci-service-role-key"
  AWS_ACCESS_KEY_ID: "ci-access-key"
  AWS_SECRET_ACCESS_KEY: "ci-secret-key"
  AWS_S3_BUCKET: "leadpoet-ci"
  AWS_S3_REGION: "us-east-2"
  OPENROUTER_API_KEY: "ci-openrouter-key"
  OPENROUTER_KEY: "ci-openrouter-key"
  SCRAPINGDOG_API_KEY: "ci-scrapingdog-key"
  BITTENSOR_NETWORK: "test"
  BITTENSOR_NETUID: "71"
  GATEWAY_PRIVATE_KEY_PASSWORD: "ci-gateway-key-password"

jobs:
  preflight:
    name: Compile, Native and Trace Checks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref || github.ref }}
          fetch-depth: 0

      - name: Verify repository instruction parity
        run: cmp --silent AGENTS.md CLAUDE.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Verify protected workflow manifest
        run: python gateway/tee/protected_workflows.py --root .

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          # Scoring tests also need the parser pinned in the scorer image.
          python -m pip install beautifulsoup4==4.14.3

      - name: Compile Python packages
        run: |
          python -m compileall -q \
            Leadpoet \
            gateway \
            leadpoet_canonical \
            leadpoet_verifier \
            qualification

      - name: Verify native Codex protocol and broker boundaries
        run: |
          python scripts/install_arena_codex.py --destination "$RUNNER_TEMP/arena-codex"
          ARENA_TEST_CODEX_BINARY="$RUNNER_TEMP/arena-codex/bin/codex" \
            python -m pytest -q \
              tests/lab_arena/codex_runtime_test.py \
              tests/lab_arena/codex_protocol_validation_test.py \
              tests/lab_arena/codex_runtime_limits_test.py

      - name: Verify trace integrity and reviewer repair seams
        run: |
          python -m pytest -q \
            tests/lab_arena/training_capture_test.py \
            tests/lab_arena/trajectory_test.py \
            tests/lab_arena/training_steps_test.py \
            tests/lab_arena/training_host_result_test.py \
            tests/lab_arena/training_call_semantics_test.py \
            tests/lab_arena/training_related_host_result_test.py \
            tests/lab_arena/training_cap_eof_test.py \
            tests/lab_arena/training_tool_error_history_test.py \
            tests/lab_arena/training_reconciled_route_evidence_test.py \
            tests/lab_arena/full_thinking_continuation_limit_test.py \
            tests/lab_arena/training_eligibility_test.py \
            tests/lab_arena/training_mixed_thinking_coverage_test.py \
            tests/lab_arena/training_storage_availability_test.py \
            tests/lab_arena/training_thinking_test.py \
            tests/lab_arena/training_eligibility_publication_test.py \
            tests/lab_arena/public_dashboard_cost_policy_test.py \
            tests/lab_arena/typed_investigator_fallback_test.py \
            tests/lab_arena/exa_contents_outer_status_test.py \
            tests/test_investigator_source_access_denied.py \
            tests/test_arena_reviewer_source_access_seam.py \
            tests/test_arena_reviewer_source_blocked_seam.py \
            tests/lab_arena/reviewer_runtime_composition_test.py

  test-shards:
    name: Pytest Shard ${{ matrix.shard }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref || github.ref }}
          fetch-depth: 0

      - name: Verify repository instruction parity
        run: cmp --silent AGENTS.md CLAUDE.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            setup.py

      - name: Verify protected workflow manifest
        run: python gateway/tee/protected_workflows.py --root .

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e .
          # Scoring tests also need the parser pinned in the scorer image.
          python -m pip install beautifulsoup4==4.14.3

      - name: Ensure PostgreSQL server binaries (migration integration test)
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 \
             && ! command -v initdb >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          pgbin="$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -r | head -1)"
          [ -n "$pgbin" ] && echo "$pgbin" >> "$GITHUB_PATH" || true
          "${pgbin:+$pgbin/}initdb" --version || true
          # Driver for the concurrent claim no-double-assign integration test.
          python -m pip install psycopg2-binary

      - name: Run complete pytest partition
        env:
          COVERAGE_FILE: ci-results/.coverage.shard-${{ matrix.shard }}
        run: |
          python -m pytest -v -rf --tb=short -p scripts.pytest_shard \
            --ci-shard-index=${{ matrix.shard }} --ci-shard-count=8 \
            --ci-shard-manifest=ci-results/shard-${{ matrix.shard }}.json \
            --cov=Leadpoet \
            --cov=gateway \
            --cov=leadpoet_canonical \
            --cov=leadpoet_verifier \
            --cov=qualification \
            --cov-report=term-missing

      - name: Upload shard execution and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-shard-${{ matrix.shard }}
          overwrite: true
          path: ci-results/
          include-hidden-files: true
          if-no-files-found: error

  test:
    # Keep the existing required check name, including its Python matrix suffix.
    name: Unit and Workflow Tests
    if: always()
    needs: [preflight, test-shards]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Require every preflight and test shard to succeed
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          SHARD_RESULT: ${{ needs.test-shards.result }}
        run: |
          test "$PREFLIGHT_RESULT" = success
          test "$SHARD_RESULT" = success

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install existing test report dependencies
        run: python -m pip install 'pytest>=8.0.0' 'coverage>=7.3.0'

      - name: Download all shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*
          path: ci-results
          merge-multiple: true

      - name: Verify complete test execution and combine coverage
        run: |
          python -m scripts.pytest_shard ci-results --count=8
          for shard in 0 1 2 3 4 5 6 7; do
            test -s "ci-results/.coverage.shard-$shard"
          done
          python -m coverage combine ci-results
          python -m coverage report
          python -m coverage xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          overwrite: true
          path: coverage.xml
          if-no-files-found: ignore

  docker-build:
    name: Docker Build Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: false
          tags: leadpoet-gateway:${{ github.sha }}
          build-args: |
            BUILD_ID=${{ github.run_id }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_REF_NAME=${{ github.ref_name }}

      - name: Build Arena Codex runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: lab_arena/judge/Dockerfile
          push: false
          tags: leadpoet-arena-judge:${{ github.sha }}
          build-args: |
            LEADPOET_BUILD_COMMIT=${{ github.sha }}
