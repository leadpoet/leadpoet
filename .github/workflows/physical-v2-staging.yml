name: Production Parity Full

on:
  workflow_run:
    workflows: [Attested V2 Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact attested main commit to validate
        required: true
        type: string

concurrency:
  group: production-parity-full
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  validate:
    if: >-
      vars.LEADPOET_PARITY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: [self-hosted, linux, x64, leadpoet-gateway-v2-builder]
    timeout-minutes: 1430
    env:
      AWS_REGION: ${{ vars.LEADPOET_PARITY_AWS_REGION }}
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.workflow_run.head_sha }}
      PRODUCTION_GATEWAY_IP: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_IP }}
      PRODUCTION_GATEWAY_URL: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_URL }}
      PRODUCTION_GATEWAY_SECRET_ID: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_SECRET_ID }}
      READONLY_DSN_SECRET_ID: ${{ vars.LEADPOET_PARITY_READONLY_DSN_SECRET_ID }}
      MINER_INTAKE_SECRET_ID: ${{ vars.LEADPOET_PARITY_MINER_INTAKE_SECRET_ID }}
      RUNNER_INSTANCE_PROFILE: ${{ vars.LEADPOET_PARITY_RUNNER_INSTANCE_PROFILE }}
      POSTGRES_IMAGE: ${{ vars.LEADPOET_PARITY_POSTGRES_IMAGE }}
      POSTGREST_IMAGE: ${{ vars.LEADPOET_PARITY_POSTGREST_IMAGE }}
      PARITY_VOLUME_GIB: ${{ vars.LEADPOET_PARITY_VOLUME_GIB }}
      FULL_TIMEOUT_SECONDS: "72000"
      SSM_TIMEOUT_SECONDS: "77400"
    steps:
      - name: Prepare isolated self-hosted controller workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_RUN_ID:-}"
          test -n "${GITHUB_RUN_ATTEMPT:-}"
          expected="$RUNNER_TEMP/production-parity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          owner_marker="$expected/.leadpoet-production-parity-owner"
          owner_token="$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          test "${#owner_token}" -eq 64
          printf '%s' "$owner_token" | grep -Eq '^[0-9a-f]{64}$'
          printf '::add-mask::%s\n' "$owner_token"
          printf 'PARITY_OWNER_TOKEN=%s\n' "$owner_token" >> "$GITHUB_ENV"
          test ! -e "$expected"
          created=false
          cleanup_partial_workspace() {
            status=$?
            if [ "$created" = true ]; then
              rm -f -- "$owner_marker"
              rmdir -- "$expected" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup_partial_workspace ERR
          mkdir -m 700 "$expected"
          created=true
          printf '%s\n' "$owner_token" > "$owner_marker"
          chmod 600 "$owner_marker"
          test -f "$owner_marker" && test ! -L "$owner_marker"
          test "$(wc -c < "$owner_marker")" -eq 65
          test "$(tr -d '\n' < "$owner_marker")" = "$owner_token"
          PARITY_TEMP="$expected"
          printf 'PARITY_TEMP=%s\n' "$PARITY_TEMP" >> "$GITHUB_ENV"
          trap - ERR

      - name: Check out exact attested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          clean: true

      - name: Require exact current main candidate before credentials
        id: provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$CANDIDATE_SHA" = "$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "${{ github.event.workflow_run.name }}" = "Attested V2 Release"
            test "${{ github.event.workflow_run.conclusion }}" = "success"
            test "${{ github.event.workflow_run.head_sha }}" = "$CANDIDATE_SHA"
          else
            GH_TOKEN="${{ github.token }}" python3 - \
              "$GITHUB_REPOSITORY" "$CANDIDATE_SHA" <<'PY'
          import json
          import os
          import re
          import sys
          from urllib import parse, request

          repository, candidate_sha = sys.argv[1:]
          if (
              re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", repository)
              is None
              or re.fullmatch(r"[0-9a-f]{40}", candidate_sha) is None
          ):
              raise SystemExit("attested release lookup identity is invalid")
          token = os.environ.get("GH_TOKEN", "")
          if not token:
              raise SystemExit("attested release lookup token is unavailable")
          query = parse.urlencode({"branch": "main", "per_page": 100})
          api_request = request.Request(
              "https://api.github.com/repos/"
              f"{repository}/actions/workflows/attested-v2-release.yml/runs?{query}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with request.urlopen(api_request, timeout=30) as response:
              payload = response.read(2_000_001)
          if len(payload) > 2_000_000:
              raise SystemExit("attested release lookup response is oversized")
          value = json.loads(payload.decode("utf-8"))
          runs = value.get("workflow_runs")
          if not isinstance(runs, list):
              raise SystemExit("attested release lookup response is invalid")
          if not any(
              isinstance(run, dict)
              and run.get("head_sha") == candidate_sha
              and run.get("head_branch") == "main"
              and run.get("conclusion") == "success"
              for run in runs
          ):
              raise SystemExit("exact candidate has no successful attested release")
          PY
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Set up exact candidate controller
        uses: ./.github/actions/setup-production-parity-controller
        with:
          python-executable: /usr/bin/python3.11

      - name: Configure parity AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Freeze candidate and source inputs
        id: inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          for name in AWS_REGION PRODUCTION_GATEWAY_IP PRODUCTION_GATEWAY_URL \
            PRODUCTION_GATEWAY_SECRET_ID READONLY_DSN_SECRET_ID \
            MINER_INTAKE_SECRET_ID \
            RUNNER_INSTANCE_PROFILE POSTGRES_IMAGE \
            POSTGREST_IMAGE PARITY_VOLUME_GIB FULL_TIMEOUT_SECONDS \
            SSM_TIMEOUT_SECONDS; do
            test -n "$(printenv "$name")"
          done
          printf '%s' "$POSTGRES_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'
          printf '%s' "$POSTGREST_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'
          test "$PARITY_VOLUME_GIB" = "512"
          test "$FULL_TIMEOUT_SECONDS" = "72000"
          test "$SSM_TIMEOUT_SECONDS" = "77400"
          test "$AWS_REGION" = "us-east-1"
          base="$(python3 scripts/resolve_production_parity_deployed_sha.py \
            --gateway-url "$PRODUCTION_GATEWAY_URL" \
            --candidate-sha "$CANDIDATE_SHA" \
            --require-distinct)"
          printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "$base" "$CANDIDATE_SHA"
          run_id="pp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          prefix="production-parity/runs/$run_id"
          printf 'base=%s\nrun_id=%s\nprefix=%s\n' \
            "$base" "$run_id" "$prefix" >> "$GITHUB_OUTPUT"

      - name: Create one disposable Nitro host
        id: stack
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(
            --region "$AWS_REGION" create
            --run-id "${{ steps.inputs.outputs.run_id }}"
            --candidate-sha "$CANDIDATE_SHA"
            --production-gateway-ip "$PRODUCTION_GATEWAY_IP"
            --instance-profile-name "$RUNNER_INSTANCE_PROFILE"
            --volume-gib "$PARITY_VOLUME_GIB"
            --state "$PARITY_TEMP/parity-stack.json"
          )
          python3 scripts/provision_production_parity_staging.py "${args[@]}"
          python3 - "$PARITY_TEMP/parity-stack.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("status") != "ready":
              raise SystemExit("disposable host is not ready")
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              handle.write(f"instance_id={value['instance_id']}\n")
              handle.write(f"supabase_origin={value['supabase_origin']}\n")
              handle.write(f"artifact_bucket={value['artifact_bucket']}\n")
          PY

      - name: Transfer exact candidate into the retained transient bucket
        id: candidate_bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git bundle create "$PARITY_TEMP/candidate.bundle" HEAD
          test "$(git bundle list-heads "$PARITY_TEMP/candidate.bundle")" = \
            "$CANDIDATE_SHA HEAD"
          git bundle verify "$PARITY_TEMP/candidate.bundle" >/dev/null
          bundle_size_bytes="$(stat -c '%s' -- "$PARITY_TEMP/candidate.bundle")"
          bundle_sha256="$(sha256sum -- "$PARITY_TEMP/candidate.bundle" | awk '{print $1}')"
          test "$bundle_size_bytes" -gt 0
          case "$bundle_sha256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#bundle_sha256}" -eq 64
          bundle_binding="$PARITY_TEMP/candidate-bundle-binding.json"
          python3 - "$bundle_binding" "$CANDIDATE_SHA" \
            "$bundle_sha256" "$bundle_size_bytes" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          output = Path(sys.argv[1])
          descriptor = os.open(
              output,
              os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC | os.O_NOFOLLOW,
              0o600,
          )
          try:
              with os.fdopen(descriptor, "w", encoding="utf-8") as handle:
                  json.dump(
                      {
                          "candidate-sha": sys.argv[2],
                          "bundle-sha256": sys.argv[3],
                          "bundle-size-bytes": sys.argv[4],
                      },
                      handle,
                      separators=(",", ":"),
                      sort_keys=True,
                  )
                  handle.write("\n")
          except BaseException:
              try:
                  os.close(descriptor)
              except OSError:
                  pass
              raise
          PY
          test -f "$bundle_binding"
          test ! -L "$bundle_binding"
          binding_size_bytes="$(stat -c '%s' -- "$bundle_binding")"
          binding_sha256="$(sha256sum -- "$bundle_binding" | awk '{print $1}')"
          test "$binding_size_bytes" -gt 0
          test "$binding_size_bytes" -le 4096
          case "$binding_sha256" in
            *[!0-9a-f]*|'') exit 1 ;;
          esac
          test "${#binding_sha256}" -eq 64
          aws s3 cp "$PARITY_TEMP/candidate.bundle" \
            "s3://${{ steps.stack.outputs.artifact_bucket }}/${{ steps.inputs.outputs.prefix }}/candidate.bundle" \
            --only-show-errors
          aws s3 cp "$bundle_binding" \
            "s3://${{ steps.stack.outputs.artifact_bucket }}/${{ steps.inputs.outputs.prefix }}/candidate-bundle-binding.json" \
            --only-show-errors
          rm -f "$bundle_binding"
          printf 'sha256=%s\nsize_bytes=%s\nbinding_sha256=%s\nbinding_size_bytes=%s\n' \
            "$bundle_sha256" "$bundle_size_bytes" \
            "$binding_sha256" "$binding_size_bytes" >> "$GITHUB_OUTPUT"

      - name: Start candidate production paths
        id: execute
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 - "$PARITY_TEMP/ssm-parameters.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          import sys
          from scripts.production_parity_bootstrap_evidence import (
              BOOTSTRAP_SSM_FAILURE_CODES,
          )
          required = {name: os.environ[name] for name in (
              "AWS_REGION", "CANDIDATE_SHA", "PRODUCTION_GATEWAY_SECRET_ID",
              "READONLY_DSN_SECRET_ID",
              "MINER_INTAKE_SECRET_ID",
              "POSTGRES_IMAGE", "POSTGREST_IMAGE", "FULL_TIMEOUT_SECONDS",
              "SSM_TIMEOUT_SECONDS",
          )}
          run_id = "${{ steps.inputs.outputs.run_id }}"
          base = "${{ steps.inputs.outputs.base }}"
          prefix = "${{ steps.inputs.outputs.prefix }}"
          origin = "${{ steps.stack.outputs.supabase_origin }}"
          artifact_bucket = "${{ steps.stack.outputs.artifact_bucket }}"
          candidate_bundle_sha256 = "${{ steps.candidate_bundle.outputs.sha256 }}"
          candidate_bundle_size_bytes = "${{ steps.candidate_bundle.outputs.size_bytes }}"
          candidate_bundle_binding_sha256 = "${{ steps.candidate_bundle.outputs.binding_sha256 }}"
          candidate_bundle_binding_size_bytes = "${{ steps.candidate_bundle.outputs.binding_size_bytes }}"
          if (
              len(candidate_bundle_sha256) != 64
              or any(character not in "0123456789abcdef" for character in candidate_bundle_sha256)
              or not candidate_bundle_size_bytes.isdigit()
              or int(candidate_bundle_size_bytes) <= 0
              or len(candidate_bundle_binding_sha256) != 64
              or any(
                  character not in "0123456789abcdef"
                  for character in candidate_bundle_binding_sha256
              )
              or not candidate_bundle_binding_size_bytes.isdigit()
              or not 0 < int(candidate_bundle_binding_size_bytes) <= 4096
          ):
              raise SystemExit("candidate bundle transfer metadata is invalid")
          root = f"/opt/leadpoet-production-parity/{run_id}"
          bootstrap_writer = Path(
              "scripts/production_parity_bootstrap_evidence.py"
          ).read_text(encoding="utf-8")
          compile(
              bootstrap_writer,
              "production_parity_bootstrap_evidence.py",
              "exec",
          )
          q = shlex.quote
          failure_response_cases = "\n".join(
              f"    {q(stage)}) printf '%s\\n' {code} ;;"
              for code, stage, _category in BOOTSTRAP_SSM_FAILURE_CODES
          )
          command = f"""
          set -Eeuo pipefail
          umask 077
          failure_stage=bootstrap-environment
          failure_category=CommandFailed
          evidence=/run/leadpoet-production-parity/full-evidence.json
          authoritative_evidence={q(root + "/full-evidence.json")}
          candidate_bundle={q(root + "/candidate.bundle")}
          candidate_bundle_binding={q(root + "/candidate-bundle-binding.json")}
          candidate_repo={q(root + "/repo")}
          candidate_git_home={q(root + "/git-home")}
          candidate_git_bin=
          host_bootstrap_step=
          candidate_bundle_sha256={q(candidate_bundle_sha256)}
          candidate_bundle_size_bytes={q(candidate_bundle_size_bytes)}
          candidate_bundle_binding_sha256={q(candidate_bundle_binding_sha256)}
          candidate_bundle_binding_size_bytes={q(candidate_bundle_binding_size_bytes)}
          failure_response_code() {{
            case "$failure_stage" in
          {failure_response_cases}
              *) return 1 ;;
            esac
          }}
          candidate_git() {{
            /usr/bin/env -i \
              PATH=/usr/bin:/bin \
              LC_ALL=C \
              HOME="$candidate_git_home" \
              XDG_CONFIG_HOME="$candidate_git_home/.config" \
              GIT_CONFIG_NOSYSTEM=1 \
              GIT_TERMINAL_PROMPT=0 \
              "$candidate_git_bin" -c init.templateDir= "$@"
          }}
          retain_failure() {{
            evidence_parent="$(dirname -- "$evidence")" || return 1
            test "$evidence_parent" != "$evidence" || return 1
            if mkdir -m 0700 -- "$evidence_parent" >/dev/null 2>&1; then
              :
            else
              test -d "$evidence_parent" || return 1
              test ! -L "$evidence_parent" || return 1
            fi
            test -d "$evidence_parent" || return 1
            test ! -L "$evidence_parent" || return 1
            /usr/bin/python3.11 -c {q(bootstrap_writer)} \
              --output "$evidence" \
              --run-id {q(run_id)} \
              --base-sha {q(base)} \
              --candidate-sha {q(required['CANDIDATE_SHA'])} \
              --stage "$failure_stage" \
              --error-category "$failure_category" >/dev/null 2>&1
          }}
          finalize_bootstrap() {{
            final_status=$?
            trap - EXIT HUP INT TERM
            set +e
            if [ "$final_status" -ne 0 ] && \
               [ "$failure_stage" = host-python-bootstrap ]; then
              case "$host_bootstrap_step" in
                container-runtime-package|container-runtime-identity|container-runtime-service|venv-absence|runtime-package|venv-create|venv-identity|python-version|requirements-resolve|pip-bootstrap|pip-install|pip-check)
                  printf 'LEADPOET_BOOTSTRAP_STEP=%s\n' \
                    "$host_bootstrap_step" >&2
                  ;;
              esac
            fi
            if [ "$final_status" -ne 0 ]; then
              retain_failure || true
            fi
            if [ "$final_status" -eq 0 ] && \
               {{ [ ! -f "$evidence" ] || [ -L "$evidence" ]; }}; then
              retain_failure || true
              final_status=1
            fi
            upload_status=0
            if [ -f "$evidence" ] && [ ! -L "$evidence" ]; then
              aws s3api put-object \
                --bucket {q(artifact_bucket)} \
                --key {q(prefix + "/full-evidence.json")} \
                --body "$evidence" \
                --content-type application/json \
                --if-none-match '*' \
                --region {q(required['AWS_REGION'])} >/dev/null 2>&1 || \
                upload_status=$?
            else
              upload_status=1
            fi
            if [ "$upload_status" -ne 0 ] && [ "$final_status" -eq 0 ]; then
              failure_stage=evidence-upload
              failure_category=EvidenceUploadFailed
              retain_failure || true
              final_status="$(failure_response_code)" || final_status=1
            elif [ "$final_status" -ne 0 ]; then
              final_status="$(failure_response_code)" || final_status=1
            fi
            rm -f "$candidate_bundle" "$candidate_bundle_binding" \
              >/dev/null 2>&1 || true
            exit "$final_status"
          }}
          trap finalize_bootstrap EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export AWS_REGION={q(required['AWS_REGION'])}
          export AWS_DEFAULT_REGION={q(required['AWS_REGION'])}
          test "$AWS_REGION" = "us-east-1"
          test "$AWS_DEFAULT_REGION" = "us-east-1"
          failure_stage=bootstrap-workspace
          sudo mkdir -p {q(root)}
          sudo chown ec2-user:ec2-user {q(root)}
          failure_stage=candidate-bundle-download
          aws s3api get-object \
            --bucket {q(artifact_bucket)} \
            --key {q(prefix + "/candidate.bundle")} \
            --region {q(required['AWS_REGION'])} \
            "$candidate_bundle" >/dev/null 2>&1
          failure_stage=candidate-bundle-metadata
          test ! -e "$candidate_bundle_binding"
          aws s3api get-object \
            --bucket {q(artifact_bucket)} \
            --key {q(prefix + "/candidate-bundle-binding.json")} \
            --region {q(required['AWS_REGION'])} \
            "$candidate_bundle_binding" >/dev/null 2>&1
          test -f "$candidate_bundle_binding"
          test ! -L "$candidate_bundle_binding"
          test "$(stat -c '%s' -- "$candidate_bundle_binding")" = \
            "$candidate_bundle_binding_size_bytes"
          test "$(sha256sum -- "$candidate_bundle_binding" | awk '{{print $1}}')" = \
            "$candidate_bundle_binding_sha256"
          rm -f "$candidate_bundle_binding"
          failure_stage=candidate-bundle-file-integrity
          test -f "$candidate_bundle"
          test ! -L "$candidate_bundle"
          test "$(stat -c '%s' -- "$candidate_bundle")" = \
            "$candidate_bundle_size_bytes"
          test "$(sha256sum -- "$candidate_bundle" | awk '{{print $1}}')" = \
            "$candidate_bundle_sha256"
          failure_stage=candidate-bundle-head
          test "$(LC_ALL=C head -n 3 -- "$candidate_bundle")" = "$(
            printf '%s\n%s HEAD' '# v2 git bundle' \
              {q(required['CANDIDATE_SHA'])}
          )"
          failure_stage=candidate-repository-directory
          mkdir -m 0700 -- "$candidate_repo" "$candidate_git_home"
          test -d "$candidate_repo"
          test ! -L "$candidate_repo"
          test -d "$candidate_git_home"
          test ! -L "$candidate_git_home"
          failure_stage=candidate-git-runtime
          if [ -x /usr/bin/git ]; then
            candidate_git_bin=/usr/bin/git
          elif [ -x /usr/local/bin/git ]; then
            candidate_git_bin=/usr/local/bin/git
          else
            test -x /usr/bin/dnf
            sudo -n /usr/bin/dnf -q -y install git-core >/dev/null 2>&1
            candidate_git_bin=/usr/bin/git
          fi
          case "$candidate_git_bin" in
            /*) ;;
            *) false ;;
          esac
          test -x "$candidate_git_bin"
          failure_stage=candidate-repository-init
          candidate_git -C "$candidate_repo" init >/dev/null 2>&1
          failure_stage=candidate-repository-structure
          test -d "$candidate_repo/.git"
          test ! -L "$candidate_repo/.git"
          # Fetching into a newly initialized empty repository verifies the
          # complete bundle and its object closure without depending on a
          # second, host-configured bare verification repository.
          failure_stage=candidate-bundle-verify
          candidate_git -C "$candidate_repo" fetch --no-tags \
            "$candidate_bundle" HEAD >/dev/null 2>&1
          failure_stage=candidate-bundle-fetch
          test "$(candidate_git -C "$candidate_repo" rev-parse FETCH_HEAD)" = \
            {q(required['CANDIDATE_SHA'])}
          failure_stage=candidate-checkout
          candidate_git -C "$candidate_repo" checkout --detach \
            {q(required['CANDIDATE_SHA'])} >/dev/null 2>&1
          test "$(candidate_git -C "$candidate_repo" rev-parse HEAD)" = \
            {q(required['CANDIDATE_SHA'])}
          failure_stage=candidate-remote-rebind
          candidate_git -C "$candidate_repo" remote add origin \
            https://github.com/leadpoet/leadpoet.git
          test "$(candidate_git -C "$candidate_repo" remote get-url origin)" = \
            https://github.com/leadpoet/leadpoet.git
          failure_stage=canonical-origin-fetch
          candidate_git -C "$candidate_repo" fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main >/dev/null 2>&1
          test "$(candidate_git -C "$candidate_repo" rev-parse origin/main)" = \
            {q(required['CANDIDATE_SHA'])}
          cd "$candidate_repo"
          host_venv={q(root + "/controller-venv")}
          host_python="$host_venv/bin/python3"
          failure_stage=host-python-bootstrap
          failure_category=CommandFailed
          host_bootstrap_step=container-runtime-package
          if [ ! -x /usr/bin/docker ]; then
            test -x /usr/bin/dnf
            sudo -n /usr/bin/dnf -q -y install docker >/dev/null 2>&1
          fi
          host_bootstrap_step=container-runtime-identity
          test -x /usr/bin/docker
          /usr/bin/rpm -qf /usr/bin/docker \
            | /usr/bin/grep -Eq '^docker-[0-9]'
          host_bootstrap_step=container-runtime-service
          sudo -n /usr/bin/systemctl start docker.service >/dev/null 2>&1
          sudo -n /usr/bin/systemctl is-active --quiet docker.service
          sudo -n /usr/bin/docker info >/dev/null 2>&1
          host_bootstrap_step=venv-absence
          test ! -e "$host_venv"
          host_bootstrap_step=runtime-package
          test -x /usr/bin/dnf
          # Amazon Linux publishes the complete Python 3.11 venv bootstrap as
          # the namespaced pip package. Install it before creating the venv so
          # the base AMI's optional package set cannot make venv fail first.
          sudo -n /usr/bin/dnf -q -y install \
            python3.11-pip >/dev/null 2>&1
          host_bootstrap_step=venv-create
          /usr/bin/python3.11 -I -m venv "$host_venv"
          host_bootstrap_step=venv-identity
          test -d "$host_venv"
          test ! -L "$host_venv"
          test -x "$host_python"
          test "$(readlink -f -- "$host_python")" = /usr/bin/python3.11
          host_bootstrap_step=python-version
          test "$("$host_python" -I -c \
            'import sys; print(f"{{sys.version_info.major}}.{{sys.version_info.minor}}")')" = \
            3.11
          host_requirements={q(root + "/host-controller-requirements.txt")}
          host_bootstrap_step=requirements-resolve
          test ! -e "$host_requirements"
          /usr/bin/python3.11 \
            scripts/resolve_production_parity_controller_requirements.py \
            --requirements requirements.txt \
            --output "$host_requirements" >/dev/null 2>&1
          test -f "$host_requirements"
          test ! -L "$host_requirements"
          host_bootstrap_step=pip-bootstrap
          PIP_CONFIG_FILE=/dev/null PYTHONNOUSERSITE=1 \
            "$host_python" -m pip --version >/dev/null 2>&1
          host_bootstrap_step=pip-install
          PIP_CONFIG_FILE=/dev/null PYTHONNOUSERSITE=1 \
            "$host_python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-cache-dir \
            --requirement "$host_requirements" >/dev/null 2>&1
          host_bootstrap_step=pip-check
          PIP_CONFIG_FILE=/dev/null PYTHONNOUSERSITE=1 \
            "$host_python" -m pip check >/dev/null 2>&1
          failure_stage=host-python-import
          failure_category=HostImportFailed
          "$host_python" \
            scripts/run_production_parity_full_host.py --help >/dev/null 2>&1
          evidence="$authoritative_evidence"
          failure_stage=host-entrypoint
          failure_category=HostEntrypointFailed
          status=0
          "$host_python" scripts/run_production_parity_full_host.py \
            --region {q(required['AWS_REGION'])} \
            --run-id {q(run_id)} \
            --base-sha {q(base)} \
            --candidate-sha {q(required['CANDIDATE_SHA'])} \
            --production-gateway-secret-id {q(required['PRODUCTION_GATEWAY_SECRET_ID'])} \
            --readonly-dsn-secret-id {q(required['READONLY_DSN_SECRET_ID'])} \
            --miner-intake-secret-id {q(required['MINER_INTAKE_SECRET_ID'])} \
            --supabase-origin {q(origin)} \
            --artifact-bucket {q(artifact_bucket)} \
            --postgres-image {q(required['POSTGRES_IMAGE'])} \
            --postgrest-image {q(required['POSTGREST_IMAGE'])} \
            --output {q(root + "/full-evidence.json")} \
            --timeout-seconds {q(required['FULL_TIMEOUT_SECONDS'])} >{q(root + "/runner.log")} 2>&1 || status=$?
          exit "$status"
          """
          Path(sys.argv[1]).write_text(
              json.dumps({
                  "commands": [command],
                  "executionTimeout": [required["SSM_TIMEOUT_SECONDS"]],
              }),
              encoding="utf-8",
          )
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "${{ steps.stack.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds "$SSM_TIMEOUT_SECONDS" \
            --parameters "file://$PARITY_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)"
          printf 'command_id=%s\n' "$command_id" >> "$GITHUB_OUTPUT"

      - name: Refresh parity AWS role for poll window 1
