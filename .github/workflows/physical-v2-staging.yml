name: Production Parity Full

on:
  workflow_run:
    workflows: [Attested V2 Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact attested main commit to validate
        required: true
        type: string

concurrency:
  group: production-parity-full
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  validate:
    if: >-
      vars.LEADPOET_PARITY_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: [self-hosted, linux, x64, leadpoet-gateway-v2-builder]
    timeout-minutes: 1430
    env:
      AWS_REGION: ${{ vars.LEADPOET_PARITY_AWS_REGION }}
      CANDIDATE_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.workflow_run.head_sha }}
      PRODUCTION_GATEWAY_IP: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_IP }}
      PRODUCTION_GATEWAY_URL: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_URL }}
      PRODUCTION_GATEWAY_SECRET_ID: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_SECRET_ID }}
      READONLY_DSN_SECRET_ID: ${{ vars.LEADPOET_PARITY_READONLY_DSN_SECRET_ID }}
      MINER_INTAKE_SECRET_ID: ${{ vars.LEADPOET_PARITY_MINER_INTAKE_SECRET_ID }}
      RUNNER_INSTANCE_PROFILE: ${{ vars.LEADPOET_PARITY_RUNNER_INSTANCE_PROFILE }}
      POSTGRES_IMAGE: ${{ vars.LEADPOET_PARITY_POSTGRES_IMAGE }}
      POSTGREST_IMAGE: ${{ vars.LEADPOET_PARITY_POSTGREST_IMAGE }}
      PARITY_VOLUME_GIB: ${{ vars.LEADPOET_PARITY_VOLUME_GIB }}
      FULL_TIMEOUT_SECONDS: "72000"
      SSM_TIMEOUT_SECONDS: "77400"
    steps:
      - name: Prepare isolated self-hosted controller workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_RUN_ID:-}"
          test -n "${GITHUB_RUN_ATTEMPT:-}"
          expected="$RUNNER_TEMP/production-parity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          owner_marker="$expected/.leadpoet-production-parity-owner"
          owner_token="$(python3 - <<'PY'
          import secrets
          print(secrets.token_hex(32))
          PY
          )"
          test "${#owner_token}" -eq 64
          printf '%s' "$owner_token" | grep -Eq '^[0-9a-f]{64}$'
          printf '::add-mask::%s\n' "$owner_token"
          printf 'PARITY_OWNER_TOKEN=%s\n' "$owner_token" >> "$GITHUB_ENV"
          test ! -e "$expected"
          created=false
          cleanup_partial_workspace() {
            status=$?
            if [ "$created" = true ]; then
              rm -f -- "$owner_marker"
              rmdir -- "$expected" 2>/dev/null || true
            fi
            exit "$status"
          }
          trap cleanup_partial_workspace ERR
          mkdir -m 700 "$expected"
          created=true
          printf '%s\n' "$owner_token" > "$owner_marker"
          chmod 600 "$owner_marker"
          test -f "$owner_marker" && test ! -L "$owner_marker"
          test "$(wc -c < "$owner_marker")" -eq 65
          test "$(tr -d '\n' < "$owner_marker")" = "$owner_token"
          PARITY_TEMP="$expected"
          printf 'PARITY_TEMP=%s\n' "$PARITY_TEMP" >> "$GITHUB_ENV"
          trap - ERR

      - name: Check out exact attested candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          clean: true

      - name: Require exact current main candidate before credentials
        id: provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$CANDIDATE_SHA" = "$(git rev-parse origin/main)"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            test "${{ github.event.workflow_run.name }}" = "Attested V2 Release"
            test "${{ github.event.workflow_run.conclusion }}" = "success"
            test "${{ github.event.workflow_run.head_sha }}" = "$CANDIDATE_SHA"
          else
            GH_TOKEN="${{ github.token }}" gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow attested-v2-release.yml \
              --commit "$CANDIDATE_SHA" --limit 20 \
              --json conclusion,headSha > "$PARITY_TEMP/attested-runs.json"
            python3 - "$PARITY_TEMP/attested-runs.json" "$CANDIDATE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys
          runs = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not any(
              run.get("headSha") == sys.argv[2]
              and run.get("conclusion") == "success"
              for run in runs
          ):
              raise SystemExit("exact candidate has no successful attested release")
          PY
            rm -f "$PARITY_TEMP/attested-runs.json"
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Set up exact candidate controller
        uses: ./.github/actions/setup-production-parity-controller
        with:
          python-executable: /usr/bin/python3.11

      - name: Configure parity AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Freeze candidate and source inputs
        id: inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$CANDIDATE_SHA"
          for name in AWS_REGION PRODUCTION_GATEWAY_IP PRODUCTION_GATEWAY_URL \
            PRODUCTION_GATEWAY_SECRET_ID READONLY_DSN_SECRET_ID \
            MINER_INTAKE_SECRET_ID \
            RUNNER_INSTANCE_PROFILE POSTGRES_IMAGE \
            POSTGREST_IMAGE PARITY_VOLUME_GIB FULL_TIMEOUT_SECONDS \
            SSM_TIMEOUT_SECONDS; do
            test -n "$(printenv "$name")"
          done
          printf '%s' "$POSTGRES_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'
          printf '%s' "$POSTGREST_IMAGE" | grep -Eq '@sha256:[0-9a-f]{64}$'
          test "$PARITY_VOLUME_GIB" = "512"
          test "$FULL_TIMEOUT_SECONDS" = "72000"
          test "$SSM_TIMEOUT_SECONDS" = "77400"
          test "$AWS_REGION" = "us-east-1"
          base="$(python3 scripts/resolve_production_parity_deployed_sha.py \
            --gateway-url "$PRODUCTION_GATEWAY_URL" \
            --candidate-sha "$CANDIDATE_SHA" \
            --require-distinct)"
          printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'
          git merge-base --is-ancestor "$base" "$CANDIDATE_SHA"
          run_id="pp-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          prefix="production-parity/runs/$run_id"
          printf 'base=%s\nrun_id=%s\nprefix=%s\n' \
            "$base" "$run_id" "$prefix" >> "$GITHUB_OUTPUT"

      - name: Create one disposable Nitro host
        id: stack
        shell: bash
        run: |
          set -Eeuo pipefail
          args=(
            --region "$AWS_REGION" create
            --run-id "${{ steps.inputs.outputs.run_id }}"
            --candidate-sha "$CANDIDATE_SHA"
            --production-gateway-ip "$PRODUCTION_GATEWAY_IP"
            --instance-profile-name "$RUNNER_INSTANCE_PROFILE"
            --volume-gib "$PARITY_VOLUME_GIB"
            --state "$PARITY_TEMP/parity-stack.json"
          )
          python3 scripts/provision_production_parity_staging.py "${args[@]}"
          python3 - "$PARITY_TEMP/parity-stack.json" "$GITHUB_OUTPUT" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if value.get("status") != "ready":
              raise SystemExit("disposable host is not ready")
          with open(sys.argv[2], "a", encoding="utf-8") as handle:
              handle.write(f"instance_id={value['instance_id']}\n")
              handle.write(f"supabase_origin={value['supabase_origin']}\n")
              handle.write(f"artifact_bucket={value['artifact_bucket']}\n")
          PY

      - name: Transfer exact candidate into the retained transient bucket
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          git bundle create "$PARITY_TEMP/candidate.bundle" --all
          git bundle verify "$PARITY_TEMP/candidate.bundle"
          aws s3 cp "$PARITY_TEMP/candidate.bundle" \
            "s3://${{ steps.stack.outputs.artifact_bucket }}/${{ steps.inputs.outputs.prefix }}/candidate.bundle" \
            --only-show-errors

      - name: Start candidate production paths
        id: execute
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          python3 - "$PARITY_TEMP/ssm-parameters.json" <<'PY'
          import json
          import os
          from pathlib import Path
          import shlex
          import sys
          from scripts.production_parity_bootstrap_evidence import (
              BOOTSTRAP_SSM_FAILURE_CODES,
          )
          required = {name: os.environ[name] for name in (
              "AWS_REGION", "CANDIDATE_SHA", "PRODUCTION_GATEWAY_SECRET_ID",
              "READONLY_DSN_SECRET_ID",
              "MINER_INTAKE_SECRET_ID",
              "POSTGRES_IMAGE", "POSTGREST_IMAGE", "FULL_TIMEOUT_SECONDS",
              "SSM_TIMEOUT_SECONDS",
          )}
          run_id = "${{ steps.inputs.outputs.run_id }}"
          base = "${{ steps.inputs.outputs.base }}"
          prefix = "${{ steps.inputs.outputs.prefix }}"
          origin = "${{ steps.stack.outputs.supabase_origin }}"
          artifact_bucket = "${{ steps.stack.outputs.artifact_bucket }}"
          root = f"/opt/leadpoet-production-parity/{run_id}"
          bootstrap_writer = Path(
              "scripts/production_parity_bootstrap_evidence.py"
          ).read_text(encoding="utf-8")
          compile(
              bootstrap_writer,
              "production_parity_bootstrap_evidence.py",
              "exec",
          )
          q = shlex.quote
          failure_response_cases = "\n".join(
              f"    {q(stage)}) printf '%s\\n' {code} ;;"
              for code, stage, _category in BOOTSTRAP_SSM_FAILURE_CODES
          )
          command = f"""
          set -Eeuo pipefail
          umask 077
          failure_stage=bootstrap-environment
          failure_category=CommandFailed
          evidence=/run/leadpoet-production-parity/full-evidence.json
          authoritative_evidence={q(root + "/full-evidence.json")}
          candidate_bundle={q(root + "/candidate.bundle")}
          failure_response_code() {{
            case "$failure_stage" in
          {failure_response_cases}
              *) return 1 ;;
            esac
          }}
          retain_failure() {{
            evidence_parent="$(dirname -- "$evidence")" || return 1
            test "$evidence_parent" != "$evidence" || return 1
            if mkdir -m 0700 -- "$evidence_parent" >/dev/null 2>&1; then
              :
            else
              test -d "$evidence_parent" || return 1
              test ! -L "$evidence_parent" || return 1
            fi
            test -d "$evidence_parent" || return 1
            test ! -L "$evidence_parent" || return 1
            /usr/bin/python3.11 -c {q(bootstrap_writer)} \
              --output "$evidence" \
              --run-id {q(run_id)} \
              --base-sha {q(base)} \
              --candidate-sha {q(required['CANDIDATE_SHA'])} \
              --stage "$failure_stage" \
              --error-category "$failure_category" >/dev/null 2>&1
          }}
          finalize_bootstrap() {{
            final_status=$?
            trap - EXIT HUP INT TERM
            set +e
            if [ "$final_status" -ne 0 ]; then
              retain_failure || true
            fi
            if [ "$final_status" -eq 0 ] && \
               {{ [ ! -f "$evidence" ] || [ -L "$evidence" ]; }}; then
              retain_failure || true
              final_status=1
            fi
            upload_status=0
            if [ -f "$evidence" ] && [ ! -L "$evidence" ]; then
              aws s3api put-object \
                --bucket {q(artifact_bucket)} \
                --key {q(prefix + "/full-evidence.json")} \
                --body "$evidence" \
                --content-type application/json \
                --if-none-match '*' \
                --region {q(required['AWS_REGION'])} >/dev/null 2>&1 || \
                upload_status=$?
            else
              upload_status=1
            fi
            if [ "$upload_status" -ne 0 ] && [ "$final_status" -eq 0 ]; then
              failure_stage=evidence-upload
              failure_category=EvidenceUploadFailed
              retain_failure || true
              final_status="$(failure_response_code)" || final_status=1
            elif [ "$final_status" -ne 0 ]; then
              final_status="$(failure_response_code)" || final_status=1
            fi
            rm -f "$candidate_bundle" >/dev/null 2>&1 || true
            exit "$final_status"
          }}
          trap finalize_bootstrap EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          export AWS_REGION={q(required['AWS_REGION'])}
          export AWS_DEFAULT_REGION={q(required['AWS_REGION'])}
          test "$AWS_REGION" = "us-east-1"
          test "$AWS_DEFAULT_REGION" = "us-east-1"
          failure_stage=bootstrap-workspace
          sudo mkdir -p {q(root)}
          sudo chown ec2-user:ec2-user {q(root)}
          failure_stage=candidate-bundle-download
          aws s3 cp {q(f"s3://{artifact_bucket}/{prefix}/candidate.bundle")} {q(root + "/candidate.bundle")} --region {q(required['AWS_REGION'])} --only-show-errors
          failure_stage=candidate-clone
          git clone {q(root + "/candidate.bundle")} {q(root + "/repo")}
          cd {q(root + "/repo")}
          git remote set-url origin https://github.com/leadpoet/leadpoet.git
          test "$(git remote get-url origin)" = https://github.com/leadpoet/leadpoet.git
          failure_stage=canonical-origin-fetch
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse origin/main)" = {q(required['CANDIDATE_SHA'])}
          failure_stage=candidate-checkout
          git checkout --detach {q(required['CANDIDATE_SHA'])}
          test "$(git rev-parse HEAD)" = {q(required['CANDIDATE_SHA'])}
          failure_stage=host-python-import
          failure_category=HostImportFailed
          /home/ec2-user/venv311/bin/python3 \
            scripts/run_production_parity_full_host.py --help >/dev/null 2>&1
          evidence="$authoritative_evidence"
          failure_stage=host-entrypoint
          failure_category=HostEntrypointFailed
          status=0
          /home/ec2-user/venv311/bin/python3 scripts/run_production_parity_full_host.py \
            --region {q(required['AWS_REGION'])} \
            --run-id {q(run_id)} \
            --base-sha {q(base)} \
            --candidate-sha {q(required['CANDIDATE_SHA'])} \
            --production-gateway-secret-id {q(required['PRODUCTION_GATEWAY_SECRET_ID'])} \
            --readonly-dsn-secret-id {q(required['READONLY_DSN_SECRET_ID'])} \
            --miner-intake-secret-id {q(required['MINER_INTAKE_SECRET_ID'])} \
            --supabase-origin {q(origin)} \
            --artifact-bucket {q(artifact_bucket)} \
            --postgres-image {q(required['POSTGRES_IMAGE'])} \
            --postgrest-image {q(required['POSTGREST_IMAGE'])} \
            --output {q(root + "/full-evidence.json")} \
            --timeout-seconds {q(required['FULL_TIMEOUT_SECONDS'])} >{q(root + "/runner.log")} 2>&1 || status=$?
          exit "$status"
          """
          Path(sys.argv[1]).write_text(
              json.dumps({
                  "commands": [command],
                  "executionTimeout": [required["SSM_TIMEOUT_SECONDS"]],
              }),
              encoding="utf-8",
          )
          PY
          command_id="$(aws ssm send-command \
            --instance-ids "${{ steps.stack.outputs.instance_id }}" \
            --document-name AWS-RunShellScript \
            --timeout-seconds "$SSM_TIMEOUT_SECONDS" \
            --parameters "file://$PARITY_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)"
          printf 'command_id=%s\n' "$command_id" >> "$GITHUB_OUTPUT"

      - name: Refresh parity AWS role for poll window 1
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account for poll window 1
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Poll candidate window 1
        id: poll1
        shell: bash
        run: |
          python3 scripts/poll_production_parity_ssm.py \
            --region "$AWS_REGION" \
            --command-id "${{ steps.execute.outputs.command_id }}" \
            --instance-id "${{ steps.stack.outputs.instance_id }}" \
            --max-wait-seconds 16200 \
            --evidence-output "$PARITY_TEMP/full-evidence.json" \
            --artifact-bucket "${{ steps.stack.outputs.artifact_bucket }}" \
            --run-id "${{ steps.inputs.outputs.run_id }}" \
            --base-sha "${{ steps.inputs.outputs.base }}" \
            --candidate-sha "$CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refresh parity AWS role for poll window 2
        if: steps.poll1.outputs.status == 'pending'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account for poll window 2
        if: steps.poll1.outputs.status == 'pending'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Poll candidate window 2
        if: steps.poll1.outputs.status == 'pending'
        id: poll2
        shell: bash
        run: |
          python3 scripts/poll_production_parity_ssm.py \
            --region "$AWS_REGION" \
            --command-id "${{ steps.execute.outputs.command_id }}" \
            --instance-id "${{ steps.stack.outputs.instance_id }}" \
            --max-wait-seconds 16200 \
            --evidence-output "$PARITY_TEMP/full-evidence.json" \
            --artifact-bucket "${{ steps.stack.outputs.artifact_bucket }}" \
            --run-id "${{ steps.inputs.outputs.run_id }}" \
            --base-sha "${{ steps.inputs.outputs.base }}" \
            --candidate-sha "$CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refresh parity AWS role for poll window 3
        if: steps.poll2.outputs.status == 'pending'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account for poll window 3
        if: steps.poll2.outputs.status == 'pending'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Poll candidate window 3
        if: steps.poll2.outputs.status == 'pending'
        id: poll3
        shell: bash
        run: |
          python3 scripts/poll_production_parity_ssm.py \
            --region "$AWS_REGION" \
            --command-id "${{ steps.execute.outputs.command_id }}" \
            --instance-id "${{ steps.stack.outputs.instance_id }}" \
            --max-wait-seconds 16200 \
            --evidence-output "$PARITY_TEMP/full-evidence.json" \
            --artifact-bucket "${{ steps.stack.outputs.artifact_bucket }}" \
            --run-id "${{ steps.inputs.outputs.run_id }}" \
            --base-sha "${{ steps.inputs.outputs.base }}" \
            --candidate-sha "$CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refresh parity AWS role for poll window 4
        if: steps.poll3.outputs.status == 'pending'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account for poll window 4
        if: steps.poll3.outputs.status == 'pending'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Poll candidate window 4
        if: steps.poll3.outputs.status == 'pending'
        id: poll4
        shell: bash
        run: |
          python3 scripts/poll_production_parity_ssm.py \
            --region "$AWS_REGION" \
            --command-id "${{ steps.execute.outputs.command_id }}" \
            --instance-id "${{ steps.stack.outputs.instance_id }}" \
            --max-wait-seconds 16200 \
            --evidence-output "$PARITY_TEMP/full-evidence.json" \
            --artifact-bucket "${{ steps.stack.outputs.artifact_bucket }}" \
            --run-id "${{ steps.inputs.outputs.run_id }}" \
            --base-sha "${{ steps.inputs.outputs.base }}" \
            --candidate-sha "$CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Refresh parity AWS role for poll window 5
        if: steps.poll4.outputs.status == 'pending'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account for poll window 5
        if: steps.poll4.outputs.status == 'pending'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Poll candidate window 5
        if: steps.poll4.outputs.status == 'pending'
        id: poll5
        shell: bash
        run: |
          python3 scripts/poll_production_parity_ssm.py \
            --region "$AWS_REGION" \
            --command-id "${{ steps.execute.outputs.command_id }}" \
            --instance-id "${{ steps.stack.outputs.instance_id }}" \
            --max-wait-seconds 12600 \
            --evidence-output "$PARITY_TEMP/full-evidence.json" \
            --artifact-bucket "${{ steps.stack.outputs.artifact_bucket }}" \
            --run-id "${{ steps.inputs.outputs.run_id }}" \
            --base-sha "${{ steps.inputs.outputs.base }}" \
            --candidate-sha "$CANDIDATE_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Require terminal SSM success within the full deadline
        shell: bash
        run: |
          test "${{ steps.poll1.outputs.status }}" = "success" || \
            test "${{ steps.poll2.outputs.status }}" = "success" || \
            test "${{ steps.poll3.outputs.status }}" = "success" || \
            test "${{ steps.poll4.outputs.status }}" = "success" || \
            test "${{ steps.poll5.outputs.status }}" = "success"

      - name: Verify redacted full evidence
        if: >-
          always() && steps.stack.outcome == 'success' &&
          steps.execute.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          aws s3 cp \
            "s3://${{ steps.stack.outputs.artifact_bucket }}/${{ steps.inputs.outputs.prefix }}/full-evidence.json" \
            "$PARITY_TEMP/full-evidence.json" --only-show-errors
          python3 - "$PARITY_TEMP/full-evidence.json" "$CANDIDATE_SHA" <<'PY'
          import json
          from pathlib import Path
          import sys
          value = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          if (
              value.get("schema_version") != "leadpoet.production_parity_full.v3"
              or value.get("status") != "passed"
              or value.get("candidate_sha") != sys.argv[2]
              or value.get("gateway", {}).get("commit_sha") != sys.argv[2]
              or value.get("rebenchmark", {}).get("available") is not True
              or value.get("allocation_handoff", {}).get(
                  "validator_verification_passed"
              ) is not True
              or value.get("weight_path", {}).get("primary_audit_equal") is not True
              or value.get("weight_path", {}).get(
                  "production_allocation_bound"
              ) is not True
              or value.get("weight_path", {}).get(
                  "production_allocation_hash"
              ) != value.get("allocation_handoff", {}).get("allocation_hash")
              or value.get("weight_path", {}).get("chain_boundary")
                  != "strict-non-forwarding"
              or value.get("acceptance_corpus", {}).get("copied_exact") is not True
              or value.get("acceptance_corpus", {}).get("candidate_sha")
                  != sys.argv[2]
              or value.get("acceptance_corpus", {}).get("fixture_count", 0) <= 0
              or value.get("external_write_boundaries", {}).get("arweave")
                  != "blocked-production-parity"
              or value.get("miner_intake", {}).get("status") != "passed"
              or value.get("miner_intake", {}).get("provider_security_write")
                  != "exact-idempotent-logging-disable"
              or value.get("miner_intake", {}).get(
                  "chain_registration_boundary"
              ) != "strict-ephemeral-hotkey"
              or value.get("miner_intake", {}).get("openrouter", {}).get(
                  "real_production_credentials"
              ) is not True
              or value.get("miner_intake", {}).get("openrouter", {}).get(
                  "admitted"
              ) is not True
              or value.get("miner_intake", {}).get("source_add", {}).get(
                  "live_provider_credential_verified"
              ) is not True
              or value.get("miner_intake", {}).get("source_add", {}).get(
                  "admitted"
              ) is not True
              or value.get("miner_intake", {}).get("source_add", {}).get(
                  "downstream_executed"
              ) is not False
              or value.get("miner_intake", {}).get("production_database_mutated")
                  is not False
              or value.get("miner_intake", {}).get("production_chain_mutated")
                  is not False
          ):
              raise SystemExit("full production-parity evidence is incomplete")
          PY

      - name: Validate redacted evidence upload path
        if: always()
        id: evidence_path
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${RUNNER_TEMP:-}"
          test -n "${GITHUB_RUN_ID:-}"
          test -n "${GITHUB_RUN_ATTEMPT:-}"
          expected="$RUNNER_TEMP/production-parity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          parity_temp="${PARITY_TEMP:-$expected}"
          owner_token="${PARITY_OWNER_TOKEN:-}"
          owner_marker="$parity_temp/.leadpoet-production-parity-owner"
          test -n "$parity_temp" && test "$parity_temp" = "$expected"
          test "${#owner_token}" -eq 64
          printf '%s' "$owner_token" | grep -Eq '^[0-9a-f]{64}$'
          test -d "$parity_temp" && test ! -L "$parity_temp"
          test -f "$owner_marker" && test ! -L "$owner_marker"
          test "$(wc -c < "$owner_marker")" -eq 65
          test "$(tr -d '\n' < "$owner_marker")" = "$owner_token"
          if [ -e "$parity_temp/full-evidence.json" ]; then
            test -f "$parity_temp/full-evidence.json"
            test ! -L "$parity_temp/full-evidence.json"
          fi
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Upload redacted evidence
        if: >-
          always() && steps.evidence_path.outputs.verified == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-parity-full-${{ env.CANDIDATE_SHA }}
          retention-days: 14
          if-no-files-found: ignore
          path: ${{ runner.temp }}/production-parity-${{ github.run_id }}-${{ github.run_attempt }}/full-evidence.json

      - name: Refresh parity AWS role for cleanup
        id: cleanup_credentials
        if: >-
          always() && steps.provenance.outputs.verified == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 21600
          unset-current-credentials: true

      - name: Require exact parity AWS account for cleanup
        id: cleanup_account
        if: >-
          always() && steps.provenance.outputs.verified == 'true' &&
          steps.cleanup_credentials.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Destroy every run-scoped resource
        if: >-
          always() && steps.provenance.outputs.verified == 'true' &&
          steps.cleanup_account.outcome == 'success'
        shell: bash
        run: |
          set +e
          if [ -z "${RUNNER_TEMP:-}" ] || [ -z "${GITHUB_RUN_ID:-}" ] || \
             [ -z "${GITHUB_RUN_ATTEMPT:-}" ]; then
            exit 1
          fi
          expected="$RUNNER_TEMP/production-parity-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          parity_temp="${PARITY_TEMP:-$expected}"
          owner_token="${PARITY_OWNER_TOKEN:-}"
          owner_marker="$parity_temp/.leadpoet-production-parity-owner"
          if [ -z "$parity_temp" ] || [ "$parity_temp" != "$expected" ]; then
            exit 1
          fi
          if [ "${#owner_token}" -ne 64 ] || \
             ! printf '%s' "$owner_token" | grep -Eq '^[0-9a-f]{64}$' || \
             [ ! -d "$parity_temp" ] || [ -L "$parity_temp" ] || \
             [ ! -f "$owner_marker" ] || [ -L "$owner_marker" ] || \
             [ "$(wc -c < "$owner_marker")" -ne 65 ] || \
             [ "$(tr -d '\n' < "$owner_marker")" != "$owner_token" ]; then
            exit 1
          fi
          cleanup_status=0
          if [ -s "$parity_temp/parity-stack.json" ]; then
            python3 scripts/provision_production_parity_staging.py \
              --region "$AWS_REGION" delete \
              --state "$parity_temp/parity-stack.json" || cleanup_status=$?
          fi
          shred -u "$parity_temp/candidate.bundle" 2>/dev/null || \
            rm -f "$parity_temp/candidate.bundle"
          rm -f "$parity_temp/ssm-parameters.json"
          rm -rf -- "$parity_temp"
          exit "$cleanup_status"

      - name: Scrub self-hosted controller workspace
        if: always()
        shell: bash
        run: |
          set +e
          cleanup_status=0
          runner_temp="${RUNNER_TEMP:-}"
          run_id="${GITHUB_RUN_ID:-}"
          run_attempt="${GITHUB_RUN_ATTEMPT:-}"
          explicit_temp="${PARITY_TEMP:-}"
          owner_token="${PARITY_OWNER_TOKEN:-}"
          if [ -z "$runner_temp" ] || [ -z "$run_id" ] || \
             [ -z "$run_attempt" ]; then
            cleanup_status=1
          else
            expected="$runner_temp/production-parity-$run_id-$run_attempt"
            parity_temp="${explicit_temp:-$expected}"
            owner_marker="$parity_temp/.leadpoet-production-parity-owner"
            if [ -z "$parity_temp" ] || [ "$parity_temp" != "$expected" ] || \
               [ "${#owner_token}" -ne 64 ] || \
               ! printf '%s' "$owner_token" | grep -Eq '^[0-9a-f]{64}$'; then
              cleanup_status=1
            elif [ ! -e "$parity_temp" ] && [ ! -L "$parity_temp" ]; then
              if [ -z "$explicit_temp" ]; then
                cleanup_status=1
              fi
            elif [ ! -d "$parity_temp" ] || [ -L "$parity_temp" ] || \
                 [ ! -f "$owner_marker" ] || [ -L "$owner_marker" ] || \
                 [ "$(wc -c < "$owner_marker")" -ne 65 ] || \
                 [ "$(tr -d '\n' < "$owner_marker")" != "$owner_token" ]; then
              cleanup_status=1
            else
              rm -rf -- "$parity_temp" || cleanup_status=$?
            fi
          fi
          git reset --hard HEAD >/dev/null 2>&1 || {
            status=$?
            if [ "$cleanup_status" -eq 0 ]; then cleanup_status=$status; fi
          }
          git clean -ffdx >/dev/null 2>&1 || {
            status=$?
            if [ "$cleanup_status" -eq 0 ]; then cleanup_status=$status; fi
          }
          exit "$cleanup_status"
