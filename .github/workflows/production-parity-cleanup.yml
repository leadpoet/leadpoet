name: Production Parity Cleanup

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: Exact production-parity run ID to clean
        required: false
        type: string
      candidate_sha:
        description: Exact candidate SHA for the selected run
        required: false
        type: string

concurrency:
  group: production-parity-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    if: vars.LEADPOET_PARITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main before credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Validate exact cleanup selection before credentials
        env:
          EXACT_RUN_ID: ${{ inputs.run_id || '' }}
          EXACT_CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -n "$EXACT_RUN_ID" ] || [ -n "$EXACT_CANDIDATE_SHA" ]; then
            printf '%s' "$EXACT_RUN_ID" | \
              grep -Eq '^pp-[0-9]{1,20}-[0-9]{1,6}$'
            printf '%s' "$EXACT_CANDIDATE_SHA" | \
              grep -Eq '^[0-9a-f]{40}$'
          fi

      - name: Set up trusted controller Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-production-parity-controller
        with:
          python-executable: ${{ env.pythonLocation }}/bin/python3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ vars.LEADPOET_PARITY_AWS_REGION }}
          unset-current-credentials: true

      - name: Require exact parity AWS account
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Remove only stale tagged resources
        env:
          EXACT_RUN_ID: ${{ inputs.run_id || '' }}
          EXACT_CANDIDATE_SHA: ${{ inputs.candidate_sha || '' }}
        run: |
          set -Eeuo pipefail
          args=(
            --region "${{ vars.LEADPOET_PARITY_AWS_REGION }}"
            --max-age-hours 30
            --apply
          )
          if [ -n "$EXACT_RUN_ID" ]; then
            args+=(
              --run-id "$EXACT_RUN_ID"
              --candidate-sha "$EXACT_CANDIDATE_SHA"
            )
          fi
          cleanup_status=0
          python3 scripts/cleanup_production_parity_staging.py "${args[@]}" \
            > "$RUNNER_TEMP/production-parity-cleanup.json" || \
            cleanup_status=$?
          cat "$RUNNER_TEMP/production-parity-cleanup.json"
          exit "$cleanup_status"

      - name: Remove expired temporary testnet signing hosts
        if: always()
        run: |
          set -Eeuo pipefail
          python3 scripts/temporary_testnet_signing_host.py \
            --region "${{ vars.LEADPOET_PARITY_AWS_REGION }}" \
            cleanup-expired --apply \
            > "$RUNNER_TEMP/temporary-testnet-signing-cleanup.json"
          cat "$RUNNER_TEMP/temporary-testnet-signing-cleanup.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-parity-cleanup-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/production-parity-cleanup.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporary-testnet-signing-cleanup-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: ignore
          path: ${{ runner.temp }}/temporary-testnet-signing-cleanup.json
