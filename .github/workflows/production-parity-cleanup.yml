name: Production Parity Cleanup

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: production-parity-cleanup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  cleanup:
    if: vars.LEADPOET_PARITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Require exact current main before credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - uses: ./.github/actions/setup-production-parity-controller

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ vars.LEADPOET_PARITY_AWS_REGION }}
          unset-current-credentials: true

      - name: Require exact parity AWS account
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Remove only stale tagged resources
        run: |
          set -Eeuo pipefail
          python3 scripts/cleanup_production_parity_staging.py \
            --region "${{ vars.LEADPOET_PARITY_AWS_REGION }}" \
            --max-age-hours 30 \
            --apply > "$RUNNER_TEMP/production-parity-cleanup.json"

      - uses: actions/upload-artifact@v4
        with:
          name: production-parity-cleanup-${{ github.run_id }}
          retention-days: 14
          path: ${{ runner.temp }}/production-parity-cleanup.json
