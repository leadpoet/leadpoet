name: Production Parity Fast

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact main commit to validate
        required: true
        type: string
      base_sha:
        description: Exact deployed N-1 commit (optional; live gateway is authoritative)
        required: false
        type: string

concurrency:
  group: production-parity-fast-${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  signed-artifact-admission:
    name: Signed Sourcing Artifact Admission
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository_id == '1075412927'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "493765492819"

    steps:
      - name: Check out exact Lead consumer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install admission dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Assume existing controller role with exact read-only session
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          role-session-name: leadpoet-signed-artifact-${{ github.run_id }}
          aws-region: us-east-1
          unset-current-credentials: true
          role-duration-seconds: 900
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Sid":"ReadExactSignedModelObjects","Effect":"Allow","Action":"s3:GetObject","Resource":["arn:aws:s3:::leadpoet-private-model-artifacts-493765492819/research-lab/sourcing-model/branches/leadpoet-lab/current.json","arn:aws:s3:::leadpoet-private-model-artifacts-493765492819/research-lab/sourcing-model/????????????????????????????????????????.json","arn:aws:s3:::leadpoet-private-model-artifacts-493765492819/research-lab/sourcing-model/????????????????????????????????????????.sig.b64"]},{"Sid":"VerifyArtifactSignature","Effect":"Allow","Action":"kms:Verify","Resource":"arn:aws:kms:us-east-1:493765492819:key/*","Condition":{"ForAnyValue:StringEquals":{"kms:ResourceAliases":"alias/leadpoet-research-lab-artifact-signing"}}},{"Sid":"AuthenticateEcr","Effect":"Allow","Action":"ecr:GetAuthorizationToken","Resource":"*"},{"Sid":"PullExactModelRepository","Effect":"Allow","Action":["ecr:BatchGetImage","ecr:GetDownloadUrlForLayer","ecr:BatchCheckLayerAvailability"],"Resource":"arn:aws:ecr:us-east-1:493765492819:repository/leadpoet/sourcing-model"}]}

      - name: Require exact artifact AWS account
        shell: bash
        run: |
          set -euo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "$AWS_ACCOUNT_ID"

      - name: Authenticate Docker to exact ECR registry
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin \
              "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

      - name: Admit current signed artifact before provider spend
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          LEADPOET_DOCKER_OPERATION_LOCK_FILE: ${{ runner.temp }}/leadpoet-docker-operation-v2.lock
          LEADPOET_DOCKER_OPERATION_ADMISSION_LOCK_FILE: ${{ runner.temp }}/leadpoet-docker-operation-v2.admission.lock
        run: python scripts/verify_signed_sourcing_artifact_admission.py

      - name: Remove ephemeral ECR login
        if: always()
        run: >-
          docker logout
          "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  validate:
    if: vars.LEADPOET_PARITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 107
    env:
      AWS_REGION: ${{ vars.LEADPOET_PARITY_AWS_REGION }}
      PRODUCTION_GATEWAY_URL: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_URL }}
      PRODUCTION_GATEWAY_SECRET_ID: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_SECRET_ID }}
      READONLY_DSN_SECRET_ID: ${{ vars.LEADPOET_PARITY_READONLY_DSN_SECRET_ID }}
      POSTGRES_IMAGE: ${{ vars.LEADPOET_PARITY_POSTGRES_IMAGE }}
      POSTGREST_IMAGE: ${{ vars.LEADPOET_PARITY_POSTGREST_IMAGE }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
          fetch-depth: 0

      - name: Require exact current main candidate before credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up trusted controller Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up exact candidate controller
        uses: ./.github/actions/setup-production-parity-controller
        with:
          python-executable: ${{ env.pythonLocation }}/bin/python3

      - name: Configure read-only parity role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 7560
          unset-current-credentials: true

      - name: Require exact parity AWS account
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Install PostgreSQL client
        run: |
          set -Eeuo pipefail
          if ! command -v psql >/dev/null || ! command -v pg_dump >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

      - name: Resolve candidate contract and read-only production input
        id: inputs
        shell: bash
        env:
          DISPATCH_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          set -Eeuo pipefail
          umask 077
          candidate="$(git rev-parse HEAD)"
          base="${DISPATCH_BASE_SHA:-}"
          if [ -z "$base" ]; then
            base="$(python3 scripts/resolve_production_parity_deployed_sha.py \
              --gateway-url "$PRODUCTION_GATEWAY_URL" \
              --candidate-sha "$candidate" \
              --require-distinct)"
          fi
          printf '%s' "$base" | grep -Eq '^[0-9a-f]{40}$'
          test "$base" != "$candidate"

          python3 scripts/capture_production_parity_runtime_config.py \
            --secret-id "$PRODUCTION_GATEWAY_SECRET_ID" \
            --region "$AWS_REGION" \
            --output "$RUNNER_TEMP/runtime-config.json"
          python3 scripts/build_production_parity_contract.py \
            --base-sha "$base" \
            --candidate-sha "$candidate" \
            --runtime-config "$RUNNER_TEMP/runtime-config.json" \
            --require-runtime-config \
            --output "$RUNNER_TEMP/candidate-contract.json"

          printf 'candidate=%s\nbase=%s\n' "$candidate" "$base" >> "$GITHUB_OUTPUT"

      - name: Capture production shape and run bounded parity
        shell: bash
        run: |
          set -Eeuo pipefail
          raw_secret="$(aws secretsmanager get-secret-value \
            --secret-id "$READONLY_DSN_SECRET_ID" \
            --query SecretString --output text)"
          export LEADPOET_PARITY_PRODUCTION_READONLY_DSN="$(RAW_SECRET="$raw_secret" python3 - <<'PY'
          import json
          import os
          value = os.environ["RAW_SECRET"]
          try:
              document = json.loads(value)
          except ValueError:
              document = value
          if isinstance(document, dict):
              document = (
                  document.get("readonly_dsn")
                  or document.get("dsn")
                  or document.get("url")
                  or ""
              )
          if not isinstance(document, str) or not document.strip():
              raise SystemExit("read-only DSN secret is invalid")
          print(document.strip())
          PY
          )"
          unset raw_secret RAW_SECRET
          echo "::add-mask::$LEADPOET_PARITY_PRODUCTION_READONLY_DSN"
          production_host="$(python3 - <<'PY'
          import os
          from urllib.parse import urlparse
          value = urlparse(os.environ['LEADPOET_PARITY_PRODUCTION_READONLY_DSN'])
          if value.scheme not in {'postgres', 'postgresql'} or not value.hostname:
              raise SystemExit('read-only production DSN is invalid')
          print(value.hostname.lower())
          PY
          )"
          export LEADPOET_PARITY_PRODUCTION_DB_HOST="$production_host"
          python3 scripts/production_parity_snapshot.py capture \
            --contract "$RUNNER_TEMP/candidate-contract.json" \
            --archive "$RUNNER_TEMP/production.dump" \
            --manifest "$RUNNER_TEMP/snapshot-manifest.json" \
            --ttl-hours 2 \
            --mode schema-only \
            --source-sha "${{ steps.inputs.outputs.base }}"
          unset LEADPOET_PARITY_PRODUCTION_READONLY_DSN LEADPOET_PARITY_PRODUCTION_DB_HOST
          python3 scripts/run_production_parity_fast.py \
            --contract "$RUNNER_TEMP/candidate-contract.json" \
            --snapshot-manifest "$RUNNER_TEMP/snapshot-manifest.json" \
            --snapshot-archive "$RUNNER_TEMP/production.dump" \
            --ledger "$RUNNER_TEMP/fast-ledger.json" \
            --production-db-host "$production_host" \
            --postgres-image "$POSTGRES_IMAGE" \
            --postgrest-image "$POSTGREST_IMAGE" \
            --region "$AWS_REGION" \
            --production-gateway-secret-id "$PRODUCTION_GATEWAY_SECRET_ID"

      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-parity-fast-${{ steps.inputs.outputs.candidate }}
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/candidate-contract.json
            ${{ runner.temp }}/snapshot-manifest.json
            ${{ runner.temp }}/fast-ledger.json

      - name: Destroy confidential snapshot
        if: always()
        shell: bash
        run: |
          set +e
          unset LEADPOET_PARITY_PRODUCTION_READONLY_DSN LEADPOET_PARITY_PRODUCTION_DB_HOST
          if [ -f "$RUNNER_TEMP/production.dump" ]; then
            shred -u "$RUNNER_TEMP/production.dump" 2>/dev/null || rm -f "$RUNNER_TEMP/production.dump"
          fi
          rm -f "$RUNNER_TEMP/runtime-config.json"
