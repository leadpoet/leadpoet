name: Production Parity Snapshot

on:
  schedule:
    # Capture the clean production frontier for the next UTC day. If GitHub
    # delays the job past midnight, candidate code rejects a contaminated day.
    - cron: "45 23 * * *"
  workflow_dispatch:

concurrency:
  group: production-parity-snapshot
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  capture:
    if: vars.LEADPOET_PARITY_INFRA_READY == 'true'
    runs-on: ubuntu-latest
    environment: production-parity-staging
    timeout-minutes: 45
    env:
      AWS_REGION: ${{ vars.LEADPOET_PARITY_AWS_REGION }}
      SNAPSHOT_BUCKET: ${{ vars.LEADPOET_PARITY_SNAPSHOT_BUCKET }}
      SNAPSHOT_KMS_KEY: ${{ vars.LEADPOET_PARITY_SNAPSHOT_KMS_KEY_ARN }}
      PRODUCTION_DB_HOST: ${{ vars.LEADPOET_PARITY_PRODUCTION_DB_HOST }}
      PRODUCTION_GATEWAY_URL: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_URL }}
      PRODUCTION_READONLY_DSN: ${{ secrets.LEADPOET_PARITY_PRODUCTION_READONLY_DSN }}
      PRODUCTION_GATEWAY_SECRET_ID: ${{ vars.LEADPOET_PARITY_PRODUCTION_GATEWAY_SECRET_ID }}
    steps:
      - name: Check out the exact current main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up exact candidate controller
        uses: ./.github/actions/setup-production-parity-controller

      - name: Configure parity AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install PostgreSQL client
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Build source contract and read-only production snapshot
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          test -n "$SNAPSHOT_BUCKET"
          test -n "$SNAPSHOT_KMS_KEY"
          test -n "$PRODUCTION_DB_HOST"
          test -n "$PRODUCTION_GATEWAY_URL"
          test -n "$PRODUCTION_READONLY_DSN"
          test -n "$PRODUCTION_GATEWAY_SECRET_ID"
          candidate="$(git rev-parse HEAD)"
          base="$(git rev-parse HEAD^)"
          source_sha="$(python3 scripts/resolve_production_parity_deployed_sha.py \
            --gateway-url "$PRODUCTION_GATEWAY_URL" \
            --candidate-sha "$candidate")"
          python3 scripts/capture_production_parity_runtime_config.py \
            --secret-id "$PRODUCTION_GATEWAY_SECRET_ID" \
            --region "$AWS_REGION" \
            --output "$RUNNER_TEMP/runtime-config.json"
          python3 scripts/build_production_parity_contract.py \
            --base-sha "$base" \
            --candidate-sha "$candidate" \
            --runtime-config "$RUNNER_TEMP/runtime-config.json" \
            --require-runtime-config \
            --output "$RUNNER_TEMP/source-contract.json"
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          prefix="production-parity/snapshots/$stamp-$candidate"
          archive_uri="s3://$SNAPSHOT_BUCKET/$prefix/production.dump"
          LEADPOET_PARITY_PRODUCTION_READONLY_DSN="$PRODUCTION_READONLY_DSN" \
          LEADPOET_PARITY_PRODUCTION_DB_HOST="$PRODUCTION_DB_HOST" \
            python3 scripts/production_parity_snapshot.py capture \
              --contract "$RUNNER_TEMP/source-contract.json" \
              --archive "$RUNNER_TEMP/production.dump" \
              --manifest "$RUNNER_TEMP/snapshot-manifest.json" \
              --s3-uri "$archive_uri" \
              --kms-key-arn "$SNAPSHOT_KMS_KEY" \
              --source-sha "$source_sha" \
              --ttl-hours 30
          python3 scripts/publish_production_parity_evidence.py \
            --bucket "$SNAPSHOT_BUCKET" \
            --key "$prefix/production.dump" \
            --file "$RUNNER_TEMP/production.dump" \
            --kms-key-id "$SNAPSHOT_KMS_KEY" \
            --region "$AWS_REGION" \
            --content-type application/octet-stream \
            --max-bytes 5368709120 \
            --object-lock-days 7 \
            > "$RUNNER_TEMP/archive-publication.json"
          manifest_uri="s3://$SNAPSHOT_BUCKET/$prefix/snapshot-manifest.json"
          python3 scripts/publish_production_parity_evidence.py \
            --bucket "$SNAPSHOT_BUCKET" \
            --key "$prefix/snapshot-manifest.json" \
            --file "$RUNNER_TEMP/snapshot-manifest.json" \
            --kms-key-id "$SNAPSHOT_KMS_KEY" \
            --region "$AWS_REGION" \
            --object-lock-days 7 \
            > "$RUNNER_TEMP/manifest-publication.json"
          python3 - "$RUNNER_TEMP/snapshot-manifest.json" "$manifest_uri" \
            "$RUNNER_TEMP/archive-publication.json" \
            "$RUNNER_TEMP/manifest-publication.json" \
            > "$RUNNER_TEMP/current.json" <<'PY'
          import json
          from pathlib import Path
          import sys

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          archive_publication = json.loads(
              Path(sys.argv[3]).read_text(encoding="utf-8")
          )
          manifest_publication = json.loads(
              Path(sys.argv[4]).read_text(encoding="utf-8")
          )
          if archive_publication.get("sha256") != manifest["archive"]["sha256"]:
              raise SystemExit("snapshot archive publication hash differs")
          print(json.dumps({
              "schema_version": "leadpoet.production_parity_snapshot_pointer.v1",
              "archive_uri": manifest["archive"]["s3_uri"],
              "archive_version_id": archive_publication["version_id"],
              "manifest_hash": manifest["manifest_hash"],
              "manifest_uri": sys.argv[2],
              "manifest_version_id": manifest_publication["version_id"],
              "source_host_hash": manifest["source_host_hash"],
              "source_sha": manifest["source_sha"],
              "target_rebenchmark_date": manifest["database"]["target_rebenchmark_date"],
          }, sort_keys=True))
          PY
          aws s3 cp "$RUNNER_TEMP/current.json" \
            "s3://$SNAPSHOT_BUCKET/production-parity/snapshots/current.json" \
            --sse aws:kms --sse-kms-key-id "$SNAPSHOT_KMS_KEY" \
            --only-show-errors

      - name: Upload non-sensitive snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-parity-snapshot-metadata
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/source-contract.json
            ${{ runner.temp }}/snapshot-manifest.json
            ${{ runner.temp }}/current.json

      - name: Remove confidential local snapshot material
        if: always()
        run: |
          rm -f -- \
            "$RUNNER_TEMP/production.dump" \
            "$RUNNER_TEMP/runtime-config.json"
