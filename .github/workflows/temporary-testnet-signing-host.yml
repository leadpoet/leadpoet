# Temporary duplicate display name is required by the existing OIDC trust.
# Remove this workflow and its helper after the testnet chain proof is complete.
name: Production Parity Full

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact current main commit for the temporary host
        required: true
        type: string
      function:
        description: Exact temporary signing function
        required: true
        default: testnet401
        type: choice
        options:
          - testnet401
      ttl_hours:
        description: Host lifetime before scheduled cleanup
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "2"
          - "4"
          - "6"
          - "8"
          - "12"

concurrency:
  group: temporary-testnet-signing-host
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  provision:
    if: vars.LEADPOET_PARITY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_REGION: ${{ vars.LEADPOET_PARITY_AWS_REGION }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      RUNNER_INSTANCE_PROFILE: ${{ vars.LEADPOET_PARITY_RUNNER_INSTANCE_PROFILE }}
      TESTNET_FUNCTION: ${{ inputs.function }}
      TESTNET_HOST_TTL_HOURS: ${{ inputs.ttl_hours }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Require exact current main before credentials
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$CANDIDATE_SHA" = "$(git rev-parse origin/main)"
          test "$AWS_REGION" = "us-east-1"
          test "$RUNNER_INSTANCE_PROFILE" = \
            "leadpoet-production-parity-runner"
          test "$TESTNET_FUNCTION" = "testnet401"
          printf '%s' "$TESTNET_HOST_TTL_HOURS" | \
            grep -Eq '^(1|2|4|6|8|12)$'

      - name: Set up trusted controller Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: ./.github/actions/setup-production-parity-controller
        with:
          python-executable: ${{ env.pythonLocation }}/bin/python3

      - name: Configure bounded parity controller role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.LEADPOET_PARITY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 3600
          unset-current-credentials: true

      - name: Require exact parity AWS account
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(aws sts get-caller-identity --query Account --output text)" = \
            "493765492819"

      - name: Provision one isolated temporary Nitro host
        id: provision
        shell: bash
        run: |
          set -Eeuo pipefail
          umask 077
          run_id="pp-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          state="$RUNNER_TEMP/temporary-testnet-signing-host.json"
          provision_pid=""
          cleanup_signal() {
            signal_status="$1"
            trap - INT TERM
            if [ -n "$provision_pid" ]; then
              kill -TERM "$provision_pid" 2>/dev/null || true
              wait "$provision_pid" 2>/dev/null || true
            fi
            python3 scripts/temporary_testnet_signing_host.py \
              --region "$AWS_REGION" cleanup-run \
              --run-id "$run_id" \
              --candidate-sha "$CANDIDATE_SHA" \
              --apply || true
            exit "$signal_status"
          }
          trap 'cleanup_signal 130' INT
          trap 'cleanup_signal 143' TERM
          python3 scripts/temporary_testnet_signing_host.py \
            --region "$AWS_REGION" create \
            --run-id "$run_id" \
            --candidate-sha "$CANDIDATE_SHA" \
            --ttl-hours "$TESTNET_HOST_TTL_HOURS" \
            --state "$state" &
          provision_pid=$!
          wait "$provision_pid"
          provision_pid=""
          trap - INT TERM
          test -s "$state"
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Upload temporary host receipt
        uses: actions/upload-artifact@v4
        with:
          name: temporary-testnet-signing-host-${{ steps.provision.outputs.run_id }}
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/temporary-testnet-signing-host.json
