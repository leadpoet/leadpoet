# Install as the last drop-in on the existing collection timer's service.
[Unit]
Description=Run one funded assignment at its published fixed price
ConditionPathExists=/home/ec2-user/.local/share/leadpoet/collection/pilot/paid/batch.json

[Service]
ExecStart=
ExecStart=/home/ec2-user/venv311/bin/python3 -B -m scripts.run_locked_collection --environment-file /home/ec2-user/.config/leadpoet/gateway.env --batch ../paid/batch.json --prompt ../prompt.json --champion-repo ../agent.git --poet-repo ../scenarios.git --max-jobs 1
