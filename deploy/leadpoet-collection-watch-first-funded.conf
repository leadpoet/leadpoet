[Service]
# Run the read-only receipt collector after an observation, including a partial read.
# A missing or failed optional receipt must not change the primary watch result.
ExecStopPost=-/home/ec2-user/.local/share/leadpoet/collection/watch/first-funded-evidence
# Resolve late native receipts separately from participation and weight checks.
ExecStartPost=-/home/ec2-user/venv311/bin/python3 -B -m scripts.reconcile_collection_generation --pending-state /home/ec2-user/.local/share/leadpoet/collection/watch/billing-cursor.json --environment-file /home/ec2-user/.config/leadpoet/gateway.env
