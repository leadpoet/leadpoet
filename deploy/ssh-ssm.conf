# Include before general Host rules in ~/.ssh/config. Keep existing known_hosts.
# IdentityFile is an operator-specific path; change it to the approved local key.
Host 52.91.135.79 gateway leadpoet-gateway-ssm
    HostName i-07e945bb2653c2e8f
    HostKeyAlias 52.91.135.79
    User ec2-user
    IdentityFile ~/.ssh/leadpoet-2026-07-28.pem
    IdentitiesOnly yes
    StrictHostKeyChecking yes
    ForwardAgent no
    ConnectTimeout 15
    ServerAliveInterval 30
    ServerAliveCountMax 3
    ProxyCommand aws --profile leadpoet-lab --region us-east-1 ssm start-session --document-name AWS-StartSSHSession --target %h --parameters portNumber=%p

